name: ci-back-identidade

on:
  push:
    paths:
      - 'code/back/identidade/**'
      - '!code/back/identidade/**.md'
      - '.github/workflows/ci-back-identidade.yml'
  pull_request:
    paths:
      - 'code/back/identidade/**'
      - '!code/back/identidade/**.md'
      - '.github/workflows/ci-back-identidade.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-back-identidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/back/identidade

    # Postgres descartavel para os testes de integracao (src/test/.../integracao/).
    # Nunca o Neon: a base de integracao apaga e recria o schema a cada contexto.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: leai_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: code/back/identidade/pom.xml

      - name: Enable Maven wrapper
        run: chmod +x mvnw

      # Os testes de integracao so rodam com DATABASE_URL_TESTE definida; sem ela
      # sao ignorados e o verify continua valendo sem banco (RNF-TST-02).
      - name: Build and test
        run: ./mvnw -B verify
        env:
          DATABASE_URL_TESTE: jdbc:postgresql://localhost:5432/leai_teste
          DATABASE_USERNAME_TESTE: postgres
          DATABASE_PASSWORD_TESTE: teste
