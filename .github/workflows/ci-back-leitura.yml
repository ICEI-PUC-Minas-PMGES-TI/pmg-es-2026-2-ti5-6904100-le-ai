name: ci-back-leitura

on:
  push:
    paths:
      - 'code/back/leitura/**'
      - '!code/back/leitura/**.md'
      - '.github/workflows/ci-back-leitura.yml'
  pull_request:
    paths:
      - 'code/back/leitura/**'
      - '!code/back/leitura/**.md'
      - '.github/workflows/ci-back-leitura.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-back-leitura-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: lint, build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/back/leitura

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: code/back/leitura/.nvmrc
          cache: npm
          cache-dependency-path: code/back/leitura/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high
