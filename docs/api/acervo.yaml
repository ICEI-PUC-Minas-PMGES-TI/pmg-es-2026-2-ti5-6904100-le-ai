openapi: 3.0.3
info:
  title: Lê Ai - acervo
  version: 0.1.0
  description: >-
    Contrato do serviço acervo para o Período 1 (F-ACV-BUSCA, F-ACV-CADASTRO e
    F-ACV-INGESTAO). As operações de cadastro por ISBN e de livro pessoal foram
    implementadas por F-ACV-CADASTRO em 18/09/2026; a busca, os assuntos e a
    página do livro, por F-ACV-BUSCA em 26/09/2026. A ingestão inicial do dump é um script
    utilitário, não uma API HTTP; por isso não há rotas administrativas de
    ingestão, recarga ou associação de assuntos neste período. O contrato é
    publicado em runtime por @nestjs/swagger em /docs e versionado aqui
    conforme RNF-ARQ-03. No Período 2, F-ACV-DESCOBERTA acrescenta os filtros
    avançados de GET /livros, as páginas de autor, editora e série e os campos
    de série e editora da página do livro, publicados como planejados antes da
    implementação.
x-contract-status: implemented
x-implementation-notes:
  - >-
    livro.importacao_solicitada está ligado ponta a ponta desde 22/09/2026: a
    solicitação e a linha de outbox são gravadas na mesma transação, o
    dispatcher de P0-MSG publica, e o consumidor acervo.importacao (fila
    leai.acervo.importacao) consulta OpenLibrary e Google Books e converge o
    livro com o mesmo tx do recibo. Com AMQP_ENABLED=false (padrão local) a
    importação permanece em `pendente`. Em DES/HML depende de AMQP_URL do
    CloudAMQP estar preenchida no painel do Render.
  - >-
    GET /livros/pessoal/{id} com via=feed depende de
    social.v_atividade_livro_pessoal_v1 e identidade.v_seguimento_aceito_v1,
    alimentadas por F-FEED e F-PERFIL desde 27/09/2026. Sem atividade ativa do
    dono sobre o livro no feed do solicitante, por seguimento aceito, nenhum
    terceiro obtém acesso, que é o comportamento fail-closed correto.
  - >-
    notaDoDono e resenhaDoDono vêm das VIEWs de leitura, alimentadas por F-AVA
    desde 27/09/2026, e saem null quando o dono não deu nota ou não escreveu
    resenha. Ausência é resposta normal, nunca erro.
  - >-
    livro.pagina_aberta está ligado ponta a ponta desde 26/09/2026: a primeira
    abertura de GET /livros/{id} grava sinopse pendente e a outbox na mesma
    transação, e o consumidor acervo.sinopse (fila leai.acervo.sinopse) consulta
    OpenLibrary e Google Books e grava disponivel, ausente ou
    falha_transitoria. Com AMQP_ENABLED=false (padrão local) a sinopse fica em
    pendente, e uma abertura depois de 15 minutos pede de novo.
  - >-
    As resenhas da página vêm de leitura.v_resenha_publicacao_v1, alimentada por
    F-AVA desde 27/09/2026, filtradas por RN-08; com a VIEW inacessível,
    resenhas vem null em GET /livros/{id} e GET /livros/{id}/resenhas
    responde 503.
x-implemented-features: [F-ACV-CADASTRO, F-ACV-BUSCA, F-ACV-INGESTAO]
x-database-contracts:
  - name: v_livro_referencia_v1
    owner: acervo
    status: implemented
    description: >-
      Referência estável de livro exposta a leitura e social. Livro pessoal
      excluído deixa de ser ativo. Consumidores não leem tabelas cruas de acervo.
      autor_exibicao é NULL em livro oficial sem autor (string_agg sobre zero
      linhas); livro pessoal sempre traz o autor informado. Corrigido em
      26/09/2026: o contrato declarava a coluna não anulável.
    consumers: [leitura, social]
    columns:
      - { name: livro_id, type: uuid, nullable: false }
      - { name: tipo, type: varchar, nullable: false, values: [oficial, pessoal] }
      - { name: dono_id, type: uuid, nullable: true }
      - { name: paginas, type: integer, nullable: false }
      - { name: titulo, type: varchar, nullable: false }
      - { name: autor_exibicao, type: varchar, nullable: true }
      - { name: capa_resolvida, type: varchar, nullable: true }
      - { name: ativo, type: boolean, nullable: false }
  - name: v_livro_recomendacao_v1
    owner: acervo
    status: implemented
    description: Uma linha por livro oficial ativo e assunto; assunto pode ser nulo.
    consumers: [social]
    columns: [livro_id, titulo, autor_exibicao, capa_resolvida, serie_id, serie_nome, assunto_id, assunto_nome]
servers:
  - url: http://localhost:3000
    description: local
tags:
  - name: health
  - name: livros
  - name: catalogo
    description: >-
      Páginas de autor, editora e série (F-ACV-DESCOBERTA). Não são perfis: não
      têm dono, não recebem conteúdo de usuário e não são editáveis.
  - name: importacoes
  - name: livros-pessoais
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: consultarSaude
      x-contract-status: implemented
      security: []
      tags: [health]
      summary: Health check do serviço (RNF-OBS-02)
      description: Retorna 200 quando o serviço está de pé e o banco responde.
      responses:
        '200':
          description: Serviço e banco saudáveis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Saude' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /livros:
    get:
      operationId: buscarLivrosOficiais
      x-contract-status: implemented
      x-implemented-by: F-ACV-BUSCA
      tags: [livros]
      summary: Busca livros oficiais
      description: >-
        Busca somente livros oficiais por título, autor, editora ou ISBN e,
        opcionalmente, filtra por um assunto do conjunto curado. O texto também
        casa com o nome do assunto (RN-21.6). A sinopse não é pesquisada. Livros
        pessoais nunca aparecem. `q` ou `assunto` é obrigatório; sem nenhum dos
        dois a resposta é 400. A comparação ignora acentos e maiúsculas e casa
        por trecho, palavra por palavra: todas as palavras de `q` precisam
        aparecer no mesmo campo, em qualquer ordem e sem depender da pontuação
        ("grande sertao veredas" acha "Grande sertão: veredas"). Um ISBN-13
        válido, ou um ISBN-10 convertido para o ISBN-13 da edição, casa também
        exatamente com o ISBN. Com `q`, a ordem é por relevância: primeiro o
        título ou o autor idêntico ao texto, depois título, autor, editora e
        assunto que o contêm; só com `assunto`, por título. Cada registro
        continua representando uma edição (RN-01), e as edições de mesmo título
        e mesmos autores chegam contíguas, para o cliente agrupá-las. `limit`
        acima de 50 é 400.

        Filtros avançados (F-ACV-DESCOBERTA, RF-ACV-03, planejados): `autor`,
        `editora` e `serie` são texto livre e casam como o `q`, por trecho, sem
        acento e palavra por palavra, cada um no seu campo; `ano` é um valor
        único; `paginasMin` e `paginasMax` formam uma faixa fechada, e cada lado
        vale sozinho. Todos se somam (AND) entre si, ao `q` e ao `assunto`.
        Com eles, qualquer critério basta: o 400 por falta de critério passa a
        sair só quando nenhum dos oito parâmetros vem preenchido, ainda no campo
        `q`. `paginasMin` maior que `paginasMax` é 400 no campo `paginasMax`.
        Sem `q`, a ordem continua por título. Livro pessoal continua fora
        (RNF-SEC-06).
      x-planned-periodo-2:
        - autor, editora, serie, ano, paginasMin e paginasMax (F-ACV-DESCOBERTA)
        - busca só com filtros, sem q e sem assunto (F-ACV-DESCOBERTA)
      parameters:
        - name: q
          in: query
          description: >-
            Texto para título, autor, editora, assunto ou ISBN. Caracteres de
            controle viram espaço e os espaços nas pontas são descartados antes
            da validação; só espaços é 400.
          schema: { type: string, minLength: 1, maxLength: 200 }
          example: Machado de Assis
        - name: assunto
          in: query
          description: Identificador do assunto curado.
          schema: { type: string, format: uuid }
        - name: autor
          in: query
          description: >-
            Planejado (F-ACV-DESCOBERTA). Trecho do nome de um dos autores. Mesmo
            tratamento do `q`: controle vira espaço, pontas aparadas, só espaços
            é 400.
          schema: { type: string, minLength: 1, maxLength: 200 }
          example: conceicao evaristo
        - name: editora
          in: query
          description: >-
            Planejado (F-ACV-DESCOBERTA). Trecho do nome canônico da editora
            (RN-12). Mesmo tratamento do `q`.
          schema: { type: string, minLength: 1, maxLength: 200 }
          example: companhia
        - name: serie
          in: query
          description: >-
            Planejado (F-ACV-DESCOBERTA). Trecho do nome da série. Mesmo
            tratamento do `q`.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: ano
          in: query
          description: Planejado (F-ACV-DESCOBERTA). Ano de publicação da edição.
          schema: { type: integer, minimum: 1, maximum: 9999 }
          example: 2019
        - name: paginasMin
          in: query
          description: Planejado (F-ACV-DESCOBERTA). Nº mínimo de páginas, inclusive.
          schema: { type: integer, minimum: 1, maximum: 100000 }
        - name: paginasMax
          in: query
          description: >-
            Planejado (F-ACV-DESCOBERTA). Nº máximo de páginas, inclusive; menor
            que `paginasMin` é 400.
          schema: { type: integer, minimum: 1, maximum: 100000 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de livros oficiais.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaLivros' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /assuntos:
    get:
      operationId: listarAssuntos
      x-contract-status: implemented
      x-implemented-by: F-ACV-BUSCA
      tags: [livros]
      summary: Lista os assuntos do conjunto curado
      description: >-
        Assuntos para o filtro da busca (RF-ACV-02, RN-21), ordenados por nome.
        O conjunto é curado e fechado, com cerca de 30 itens; o servidor impõe
        o teto de 100 (RNF-DES-02).
      responses:
        '200':
          description: Assuntos disponíveis para o filtro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaAssuntos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /livros/{id}:
    get:
      operationId: obterLivroOficial
      x-contract-status: implemented
      x-implemented-by: F-ACV-BUSCA
      tags: [livros]
      summary: Obtém a página de um livro oficial
      description: >-
        Retorna imediatamente os metadados, a capa resolvida e a primeira página
        de resenhas autorizadas. Na primeira abertura, se a sinopse ainda estiver
        nao_consultada, o serviço muda seu estado para pendente e publica uma
        única mensagem livro.pagina_aberta de forma concorrente e idempotente.
        A consulta externa ocorre depois, na ordem OpenLibrary, Google Books e
        ausência. A resposta nunca aguarda essa consulta. disponivel e ausente
        são estados terminais da busca automática. Uma abertura posterior
        reenfileira, também uma vez só, a falha_transitoria com mais de 10
        minutos e a pendente com mais de 15 minutos (mensagem perdida ou que foi
        para a DLQ); o relógio é o atualizado_em do livro. Sinopse ausente é
        resposta normal, não erro. A primeira página traz até 10 resenhas de
        outros leitores (RF-ACV-04): a do próprio solicitante não entra. Quando
        os contratos de leitura ou identidade estão indisponíveis, resenhas vem
        null e a página abre mesmo assim. Nota geral, nota dos leitores e
        distribuição não fazem parte deste contrato do Período 1. A rota tem
        rate limiting por identidade e IP, porque a abertura dispara consulta a
        fonte externa.

        F-ACV-DESCOBERTA (planejado) acrescenta `editoraId` e `serie` (id, nome e
        número de ordem) para os links da ficha às páginas de editora e série; o
        id de cada autor já vem em `autores`. Cada assunto em `assuntos` é
        acionável como filtro: o cliente leva o `id` a GET /livros?assunto=<id>
        (RF-ACV-21, RN-21).
      x-planned-periodo-2:
        - editoraId e serie (F-ACV-DESCOBERTA)
      parameters:
        - $ref: '#/components/parameters/LivroId'
      responses:
        '200':
          description: Detalhe do livro, inclusive enquanto a sinopse é carregada ou está ausente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivroOficialDetalhe' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /livros/{id}/resenhas:
    get:
      operationId: listarResenhasDoLivro
      x-contract-status: implemented
      x-implemented-by: F-ACV-BUSCA
      tags: [livros]
      summary: Lista as próximas resenhas autorizadas de um livro oficial
      description: >-
        Usa cursor opaco e aplica no servidor a privacidade de RN-08 por meio dos
        contratos versionados de leitura e identidade: autor público, ou privado
        que o solicitante segue com seguimento aceito; conta suspensa ou em
        exclusão não aparece. A resenha do próprio solicitante não entra. Ordem
        da mais recente para a mais antiga. Livro inexistente, pessoal ou
        inativo responde 404; cursor que não veio de uma página anterior, 400.
      parameters:
        - $ref: '#/components/parameters/LivroId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
      responses:
        '200':
          description: Página de resenhas visíveis ao solicitante.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaResenhas' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /autores/{id}:
    get:
      operationId: obterAutor
      x-contract-status: planned-periodo-2
      x-planned-by: F-ACV-DESCOBERTA
      tags: [catalogo]
      summary: Obtém a página de um autor
      description: >-
        Página de autor (RF-ACV-10): nome, biografia curta e os livros oficiais
        ativos daquele autor, paginados. A biografia vem da OpenLibrary, gravada
        pela ingestão e pela importação por ISBN; sem biografia na fonte o campo
        vem null e a seção não é exibida. Nada é consultado na fonte durante a
        requisição. Os livros vêm do ano mais recente do grupo para o mais
        antigo, com as edições de mesmo título e autores contíguas (RN-01) e os
        grupos sem ano no fim; `livros.totalItens` conta edições e é o "N livros
        no acervo". Autor que existe sem livro oficial ativo responde 200 com a
        lista vazia; autor inexistente, 404. Livro pessoal nunca aparece
        (RNF-SEC-06).
      parameters:
        - $ref: '#/components/parameters/AutorId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página do autor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDoAutor' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /editoras/{id}:
    get:
      operationId: obterEditora
      x-contract-status: planned-periodo-2
      x-planned-by: F-ACV-DESCOBERTA
      tags: [catalogo]
      summary: Obtém a página de uma editora
      description: >-
        Página de editora (RF-ACV-11): nome canônico (RN-12) e os livros
        oficiais ativos daquela editora, paginados, na mesma ordem da página de
        autor. Editora que existe sem livro oficial ativo responde 200 com a
        lista vazia; editora inexistente, 404. Livro pessoal nunca aparece
        (RNF-SEC-06).
      parameters:
        - $ref: '#/components/parameters/EditoraId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página da editora.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDaEditora' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /series/{id}:
    get:
      operationId: obterSerie
      x-contract-status: planned-periodo-2
      x-planned-by: F-ACV-DESCOBERTA
      tags: [catalogo]
      summary: Obtém a página de uma série
      description: >-
        Página de série (RF-ACV-12): nome, autores dos livros da série e os
        livros oficiais ativos, paginados, em ordem crescente do número de ordem
        (RN-12). Livros sem número vêm no fim, por título. Lacuna na numeração
        não gera item. Edições com o mesmo número ficam contíguas, da mais
        recente para a mais antiga. Série que existe sem livro oficial ativo
        responde 200 com a lista e os autores vazios; série inexistente, 404.
        Livro pessoal nunca aparece (RNF-SEC-06).
      parameters:
        - $ref: '#/components/parameters/SerieId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página da série.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDaSerie' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /livros/oficial:
    post:
      operationId: solicitarImportacaoPorIsbn
      x-contract-status: implemented
      x-implemented-by: F-ACV-CADASTRO
      tags: [importacoes]
      summary: Solicita a importação assíncrona de um livro oficial por ISBN-13
      description: >-
        Aceita somente ISBN-13 válido, nunca URL. Para ISBN novo, cria uma
        solicitação idempotente, grava a outbox de livro.importacao_solicitada e
        responde 202 sem aguardar OpenLibrary ou Google Books. ISBN já existente
        responde 409 com livroId e o resumo do livro existente. A operação tem
        rate limiting por IP e identidade.
        Repetir a mesma Idempotency-Key com o mesmo corpo devolve a resposta
        original; reutilizá-la com corpo diferente responde 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitarImportacao' }
      responses:
        '202':
          description: Solicitação persistida e publicação assíncrona aceita.
          headers:
            Location:
              description: URL de acompanhamento da importação.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportacaoAceita' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '413': { $ref: '#/components/responses/CorpoMuitoGrande' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '409':
          description: ISBN já cadastrado ou chave de idempotência reutilizada com outro corpo.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErroLivroExistente'
                  - $ref: '#/components/schemas/Erro'
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /livros/importacoes/{id}:
    get:
      operationId: obterImportacaoPorIsbn
      x-contract-status: implemented
      x-implemented-by: F-ACV-CADASTRO
      tags: [importacoes]
      summary: Consulta uma importação por ISBN
      description: >-
        Somente o solicitante pode consultar. nao_encontrado significa que ambas
        as fontes responderam sem o ISBN e habilita o cadastro pessoal;
        falha_transitoria significa indisponibilidade após as retentativas e não
        deve ser confundida com ausência do livro.
      parameters:
        - $ref: '#/components/parameters/ImportacaoId'
      responses:
        '200':
          description: Estado atual da importação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Importacao' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /livros/importacoes/{id}/reprocessar:
    post:
      operationId: reprocessarImportacaoPorIsbn
      x-contract-status: implemented
      x-implemented-by: F-ACV-CADASTRO
      tags: [importacoes]
      summary: Reprocessa uma importação com falha transitória
      description: >-
        Somente o solicitante pode reenfileirar uma solicitação em
        falha_transitoria. Mantém importacaoId e ISBN normalizado e converge para
        o livro oficial existente se outra execução já o criou. Repetição e
        conflito da Idempotency-Key seguem a mesma semântica das demais escritas.
      parameters:
        - $ref: '#/components/parameters/ImportacaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Reprocessamento aceito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportacaoAceita' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /livros/pessoal:
    post:
      operationId: criarLivroPessoal
      x-contract-status: implemented
      x-implemented-by: F-ACV-CADASTRO
      tags: [livros-pessoais]
      summary: Cria um livro pessoal
      description: >-
        Cria um livro sem ISBN, pertencente ao usuário autenticado. A capa já
        enviada diretamente ao Cloudinary é opcional e deve ter passado pelas
        validações de tipo real, tamanho e dimensões. O livro não entra na busca,
        catálogo nem páginas de autor, editora ou série. Repetição e conflito da
        Idempotency-Key seguem a semântica comum das escritas.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LivroPessoalEntrada' }
      responses:
        '201':
          description: Livro pessoal criado.
          headers:
            Location:
              description: URL do livro pessoal criado.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivroPessoalDetalhe' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '413': { $ref: '#/components/responses/CorpoMuitoGrande' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /livros/pessoal/{id}:
    get:
      operationId: obterLivroPessoal
      x-contract-status: implemented
      x-implemented-by: F-ACV-CADASTRO
      tags: [livros-pessoais]
      summary: Obtém um livro pessoal com autorização RN-15
      description: >-
        O dono acessa diretamente, sem via. No Período 1, terceiro deve informar
        via=feed e referenciaId de uma atividade ativa do dono que referencia o
        mesmo livro e integra seu feed por seguimento aceito. A autorização e a
        privacidade do perfil são revalidadas nesta requisição, inclusive para
        perfil público. Conhecer o ID, forjar a referência ou omitir a via não
        concede acesso.

        Via lista (F-LST, Período 2, planejada): terceiro informa via=lista e
        referenciaId de uma lista ativa do dono que contém o mesmo livro,
        comprovada por social.v_lista_livro_pessoal_v1. Diferente da via
        feed, vale a privacidade da lista (RN-08): perfil público do dono
        libera qualquer leitor autenticado, sem exigir seguimento; perfil
        privado exige seguimento aceito. Lista excluída ou livro removido da
        lista encerram o acesso. Terceiro continua sempre em modo consulta.
      x-planned-periodo-2:
        - via=lista (F-LST)
      parameters:
        - $ref: '#/components/parameters/LivroPessoalId'
        - name: via
          in: query
          description: >-
            Prova de origem exigida somente para acesso de terceiro. lista
            está planejada para F-LST e ainda responde 400 até a entrega.
          schema: { type: string, enum: [feed, lista] }
        - name: referenciaId
          in: query
          description: >-
            UUID que comprova a via RN-15: a atividade de feed em via=feed ou
            a lista do dono em via=lista.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalhe autorizado; para terceiro, sempre em modo consulta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivroPessoalDetalhe' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }
    patch:
      operationId: atualizarLivroPessoal
      x-contract-status: implemented
      x-implemented-by: F-ACV-CADASTRO
      tags: [livros-pessoais]
      summary: Atualiza um livro pessoal do próprio usuário
      description: >-
        Propriedade é validada no servidor; acesso RN-15 de terceiro é somente
        leitura e nunca autoriza esta operação. Repetição e conflito da
        Idempotency-Key seguem a semântica comum das escritas.
      parameters:
        - $ref: '#/components/parameters/LivroPessoalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LivroPessoalAtualizacao' }
      responses:
        '200':
          description: Livro pessoal atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivroPessoalDetalhe' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '413': { $ref: '#/components/responses/CorpoMuitoGrande' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }
    delete:
      operationId: excluirLivroPessoal
      x-contract-status: implemented
      x-implemented-by: F-ACV-CADASTRO
      tags: [livros-pessoais]
      summary: Exclui um livro pessoal do próprio usuário
      description: >-
        Propriedade é validada no servidor; acesso RN-15 de terceiro é somente
        leitura. A confirmação explícita ocorre no cliente. Após a exclusão, o
        livro fica inativo em v_livro_referencia_v1 e todo acesso de terceiro
        cessa imediatamente. Repetição e conflito da Idempotency-Key seguem a
        semântica comum das escritas.
      parameters:
        - $ref: '#/components/parameters/LivroPessoalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Livro pessoal excluído; resposta sem corpo.
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LivroId:
      name: id
      in: path
      required: true
      description: Identificador não sequencial do livro oficial.
      schema: { type: string, format: uuid }
    AutorId:
      name: id
      in: path
      required: true
      description: Identificador não sequencial do autor.
      schema: { type: string, format: uuid }
    EditoraId:
      name: id
      in: path
      required: true
      description: Identificador não sequencial da editora.
      schema: { type: string, format: uuid }
    SerieId:
      name: id
      in: path
      required: true
      description: Identificador não sequencial da série.
      schema: { type: string, format: uuid }
    LivroPessoalId:
      name: id
      in: path
      required: true
      description: Identificador não sequencial do livro pessoal.
      schema: { type: string, format: uuid }
    ImportacaoId:
      name: id
      in: path
      required: true
      description: Identificador não sequencial da solicitação de importação.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Página iniciada em 1, com teto de 100000.
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
    Limit:
      name: limit
      in: query
      description: Itens por página; o servidor impõe o teto de 50.
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco retornado na página anterior.
      schema: { type: string, minLength: 1, maxLength: 500 }
    CursorLimit:
      name: limit
      in: query
      description: Itens por página; o servidor impõe o teto de 50.
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID gerado pelo cliente. O escopo é usuário autenticado + operação.
        Repetir a chave com o mesmo payload devolve a resposta original sem novo
        efeito; reutilizá-la com payload diferente responde 409.
      schema: { type: string, format: uuid }
  responses:
    RequisicaoInvalida:
      description: Parâmetros ou corpo inválidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroValidacao' }
    CorpoMuitoGrande:
      description: >-
        Corpo da requisição acima do tamanho aceito pelo leitor de JSON (100 KB),
        com o código `CORPO_MUITO_GRANDE`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoAutenticado:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    AcessoNegado:
      description: Usuário sem propriedade ou sem uma via RN-15 válida.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoEncontrado:
      description: Recurso inexistente ou indisponível ao solicitante.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Conflito:
      description: Estado atual impede a operação ou a chave de idempotência conflita.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    LimiteExcedido:
      description: Limite de requisições excedido.
      headers:
        Retry-After:
          description: Segundos até uma nova tentativa.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    ServicoIndisponivel:
      description: Serviço, banco ou dependência temporariamente indisponível.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
  schemas:
    Saude:
      type: object
      additionalProperties: false
      required: [status, service, time]
      properties:
        status: { type: string, enum: [ok], example: ok }
        service: { type: string, enum: [acervo], example: acervo }
        time: { type: string, format: date-time }
    Erro:
      type: object
      additionalProperties: false
      description: Corpo de erro padronizado (RNF-ERR-01), em pt-BR e sem detalhe técnico.
      required: [codigo, mensagem, correlationId]
      properties:
        codigo: { type: string, example: RECURSO_NAO_ENCONTRADO }
        mensagem: { type: string, example: Não encontramos o que você procura. }
        correlationId: { type: string, format: uuid }
    ErroValidacao:
      allOf:
        - $ref: '#/components/schemas/Erro'
        - type: object
          properties:
            campos:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [campo, mensagem]
                properties:
                  campo: { type: string, example: isbn }
                  mensagem: { type: string, example: Informe um ISBN-13 válido. }
    ErroLivroExistente:
      allOf:
        - $ref: '#/components/schemas/Erro'
        - type: object
          required: [livroId]
          properties:
            livroId: { type: string, format: uuid }
            livro:
              $ref: '#/components/schemas/LivroImportadoResumo'
    LivroImportadoResumo:
      type: object
      additionalProperties: false
      description: >-
        Resumo da edição para o card de confirmação do cadastro por ISBN
        (livro encontrado ou já existente). Não substitui a página do livro,
        que é de F-ACV-BUSCA.
      required: [id, titulo, autores, editora, anoPublicacao, paginas, capaUrl]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string, minLength: 1, maxLength: 500 }
        autores:
          type: string
          nullable: true
          description: Autores para exibição, separados por vírgula.
        editora: { type: string, nullable: true }
        anoPublicacao: { type: integer, minimum: 1, maximum: 9999, nullable: true }
        paginas: { type: integer, minimum: 1 }
        capaUrl:
          type: string
          format: uri
          nullable: true
          description: Capa resolvida, cópia própria e depois URL externa.
    AutorResumo:
      type: object
      additionalProperties: false
      required: [id, nome]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, minLength: 1, maxLength: 200 }
    AssuntoResumo:
      type: object
      additionalProperties: false
      required: [id, nome]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, minLength: 1, maxLength: 100 }
    ListaAssuntos:
      type: object
      additionalProperties: false
      required: [itens]
      properties:
        itens:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AssuntoResumo' }
    Capa:
      type: object
      additionalProperties: false
      required: [origem]
      description: Resolução na ordem cópia própria, URL externa e placeholder.
      properties:
        url: { type: string, format: uri, nullable: true }
        origem: { type: string, enum: [propria, externa, placeholder] }
    LivroOficialResumo:
      type: object
      additionalProperties: false
      required: [id, titulo, autores, editora, anoPublicacao, paginas, capa, assuntos]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string, minLength: 1, maxLength: 500 }
        autores:
          type: array
          minItems: 0
          description: >-
            Ordenados por nome. Pode vir vazio: parte do acervo carregado não
            tem autor na fonte.
          items: { $ref: '#/components/schemas/AutorResumo' }
        editora: { type: string, minLength: 1, maxLength: 200, nullable: true }
        anoPublicacao: { type: integer, minimum: 1, maximum: 9999, nullable: true }
        paginas: { type: integer, minimum: 1 }
        capa: { $ref: '#/components/schemas/Capa' }
        assuntos:
          type: array
          items: { $ref: '#/components/schemas/AssuntoResumo' }
    PaginaLivros:
      type: object
      additionalProperties: false
      required: [itens, page, limit, totalItens, totalPaginas]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/LivroOficialResumo' }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
        totalItens: { type: integer, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
    ResenhaResumo:
      type: object
      additionalProperties: false
      required: [id, autorId, autorNome, texto, spoiler, criadoEm, atualizadoEm]
      properties:
        id: { type: string, format: uuid }
        autorId: { type: string, format: uuid }
        autorNome: { type: string, minLength: 1, maxLength: 200 }
        autorAvatarUrl: { type: string, format: uri, nullable: true }
        texto: { type: string }
        spoiler: { type: boolean }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    PaginaResenhas:
      type: object
      additionalProperties: false
      required: [itens, limit, proximoCursor]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/ResenhaResumo' }
        limit: { type: integer, minimum: 1, maximum: 50 }
        proximoCursor: { type: string, nullable: true }
    Sinopse:
      type: object
      additionalProperties: false
      required: [status, texto]
      description: >-
        texto só é preenchido em disponivel. null em nao_consultada, pendente,
        ausente e falha_transitoria; ausente não representa erro.
      properties:
        status:
          type: string
          enum: [nao_consultada, pendente, disponivel, ausente, falha_transitoria]
        texto: { type: string, maxLength: 4000, nullable: true }
    LivroOficialDetalhe:
      type: object
      additionalProperties: false
      description: >-
        Os campos de LivroOficialResumo mais ISBN, sinopse e a primeira página de
        resenhas. Declarado por extenso, e não como allOf, porque o resumo tem
        additionalProperties false e recusaria os campos a mais.
      required: [id, titulo, autores, editora, anoPublicacao, paginas, capa, assuntos, isbn, sinopse, resenhas]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string, minLength: 1, maxLength: 500 }
        autores:
          type: array
          minItems: 0
          items: { $ref: '#/components/schemas/AutorResumo' }
        editora: { type: string, minLength: 1, maxLength: 200, nullable: true }
        editoraId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Planejado (F-ACV-DESCOBERTA). Leva à página da editora; null quando
            o livro não tem editora. Entra em `required` ao ser implementado.
        anoPublicacao: { type: integer, minimum: 1, maximum: 9999, nullable: true }
        paginas: { type: integer, minimum: 1 }
        capa: { $ref: '#/components/schemas/Capa' }
        assuntos:
          type: array
          description: >-
            Cada assunto é acionável como filtro: GET /livros?assunto=<id>
            (RF-ACV-21).
          items: { $ref: '#/components/schemas/AssuntoResumo' }
        serie:
          allOf:
            - $ref: '#/components/schemas/SerieDoLivro'
          nullable: true
          description: >-
            Planejado (F-ACV-DESCOBERTA). null quando o livro não pertence a uma
            série. Entra em `required` ao ser implementado.
        isbn:
          type: string
          pattern: '^97[89][0-9]{10}$'
          example: '9788535914849'
        sinopse: { $ref: '#/components/schemas/Sinopse' }
        resenhas:
          allOf:
            - $ref: '#/components/schemas/PaginaResenhas'
          nullable: true
          description: >-
            null quando os contratos de leitura ou identidade estão
            indisponíveis; a página abre mesmo assim.
    SerieDoLivro:
      type: object
      additionalProperties: false
      required: [id, nome, numero]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, minLength: 1, maxLength: 200 }
        numero:
          type: integer
          minimum: 1
          nullable: true
          description: Número de ordem do livro na série; null quando a fonte não o tem.
    PaginaDoAutor:
      type: object
      additionalProperties: false
      required: [id, nome, biografia, livros]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, minLength: 1, maxLength: 200 }
        biografia:
          type: string
          nullable: true
          maxLength: 2000
          description: >-
            Texto puro da OpenLibrary, no idioma da fonte. null quando a fonte
            não tem biografia: a seção não é exibida (RF-ACV-10).
        livros: { $ref: '#/components/schemas/PaginaLivros' }
    PaginaDaEditora:
      type: object
      additionalProperties: false
      required: [id, nome, livros]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, minLength: 1, maxLength: 200 }
        livros: { $ref: '#/components/schemas/PaginaLivros' }
    LivroDaSerieResumo:
      type: object
      additionalProperties: false
      description: >-
        Os campos de LivroOficialResumo mais o número de ordem. Declarado por
        extenso pelo mesmo motivo de LivroOficialDetalhe.
      required: [id, titulo, autores, editora, anoPublicacao, paginas, capa, assuntos, numeroNaSerie]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string, minLength: 1, maxLength: 500 }
        autores:
          type: array
          minItems: 0
          items: { $ref: '#/components/schemas/AutorResumo' }
        editora: { type: string, minLength: 1, maxLength: 200, nullable: true }
        anoPublicacao: { type: integer, minimum: 1, maximum: 9999, nullable: true }
        paginas: { type: integer, minimum: 1 }
        capa: { $ref: '#/components/schemas/Capa' }
        assuntos:
          type: array
          items: { $ref: '#/components/schemas/AssuntoResumo' }
        numeroNaSerie: { type: integer, minimum: 1, nullable: true }
    PaginaLivrosDaSerie:
      type: object
      additionalProperties: false
      required: [itens, page, limit, totalItens, totalPaginas]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/LivroDaSerieResumo' }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
        totalItens: { type: integer, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
    PaginaDaSerie:
      type: object
      additionalProperties: false
      required: [id, nome, autores, livros]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, minLength: 1, maxLength: 200 }
        autores:
          type: array
          description: >-
            Autores distintos dos livros oficiais ativos da série, por nome,
            para a linha de autoria da página.
          items: { $ref: '#/components/schemas/AutorResumo' }
        livros: { $ref: '#/components/schemas/PaginaLivrosDaSerie' }
    SolicitarImportacao:
      type: object
      additionalProperties: false
      required: [isbn]
      properties:
        isbn:
          type: string
          description: ISBN-13; separadores podem ser normalizados pelo servidor.
          minLength: 13
          maxLength: 17
          example: '978-85-359-1484-9'
    ImportacaoStatus:
      type: string
      enum: [pendente, concluida, nao_encontrado, falha_transitoria]
    ImportacaoAceita:
      type: object
      additionalProperties: false
      required: [importacaoId, status]
      properties:
        importacaoId: { type: string, format: uuid }
        status: { type: string, enum: [pendente] }
    Importacao:
      type: object
      additionalProperties: false
      required: [importacaoId, isbn, status, livroId, livro, permiteCadastroPessoal, criadoEm, atualizadoEm]
      properties:
        importacaoId: { type: string, format: uuid }
        isbn:
          type: string
          pattern: '^97[89][0-9]{10}$'
        status: { $ref: '#/components/schemas/ImportacaoStatus' }
        livroId:
          type: string
          format: uuid
          nullable: true
          description: Preenchido somente quando status é concluida.
        livro:
          allOf:
            - $ref: '#/components/schemas/LivroImportadoResumo'
          nullable: true
          description: Resumo do livro, somente quando status é concluida.
        permiteCadastroPessoal:
          type: boolean
          description: true somente quando status é nao_encontrado.
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    LivroPessoalEntrada:
      type: object
      additionalProperties: false
      required: [titulo, autor, paginas]
      properties:
        titulo: { type: string, minLength: 1, maxLength: 500 }
        autor: { type: string, minLength: 1, maxLength: 200 }
        paginas: { type: integer, minimum: 1 }
        sinopse: { type: string, maxLength: 4000, nullable: true }
        capaUrl:
          type: string
          format: uri
          nullable: true
          description: URL do asset validado enviado diretamente ao Cloudinary.
    LivroPessoalAtualizacao:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        titulo: { type: string, minLength: 1, maxLength: 500 }
        autor: { type: string, minLength: 1, maxLength: 200 }
        paginas: { type: integer, minimum: 1 }
        sinopse: { type: string, maxLength: 4000, nullable: true }
        capaUrl: { type: string, format: uri, nullable: true }
    NotaDoDono:
      type: object
      additionalProperties: false
      required: [valor]
      description: Nota individual do dono; nunca média nem contagem.
      properties:
        valor:
          type: number
          minimum: 0
          maximum: 5
          multipleOf: 0.5
    DonoResumo:
      type: object
      additionalProperties: false
      required: [nome, avatarUrl]
      description: >-
        Quem cadastrou o livro pessoal, lido de `identidade.v_perfil_referencia_v1`, para a
        linha de atribuição do modo consulta. Antes o nome só chegava dentro de
        `resenhaDoDono`, e o terceiro não sabia de quem era um livro sem resenha.
      properties:
        nome: { type: string, minLength: 1, maxLength: 200 }
        avatarUrl: { type: string, format: uri, nullable: true }
    LivroPessoalDetalhe:
      type: object
      additionalProperties: false
      required: [id, tipo, donoId, titulo, autor, paginas, sinopse, capaUrl, modoConsulta, notaDoDono, resenhaDoDono, dono]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [pessoal] }
        donoId: { type: string, format: uuid }
        titulo: { type: string, minLength: 1, maxLength: 500 }
        autor: { type: string, minLength: 1, maxLength: 200 }
        paginas: { type: integer, minimum: 1 }
        sinopse: { type: string, maxLength: 4000, nullable: true }
        capaUrl: { type: string, format: uri, nullable: true }
        modoConsulta:
          type: boolean
          description: true para terceiro autorizado por RN-15; false para o dono.
        notaDoDono:
          allOf:
            - $ref: '#/components/schemas/NotaDoDono'
          nullable: true
        resenhaDoDono:
          allOf:
            - $ref: '#/components/schemas/ResenhaResumo'
          nullable: true
        dono:
          allOf:
            - $ref: '#/components/schemas/DonoResumo'
          nullable: true
          description: >-
            `null` quando o perfil do dono não está na VIEW (conta suspensa ou com exclusão
            pendente) ou quando a VIEW falha; a página não inventa um nome.
