        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /recomendacoes:
    post:
      tags: [recomendacoes]
      summary: Recomenda um livro oficial a um ou mais leitores (RF-REC-01/03/06/07)
      operationId: recomendarLivro
      x-implementation-status: implemented
      description: >-
        Cria uma recomendação independente por destinatário, sem estado de
        aceitação (RN-22). Livro pessoal ou inexistente rejeita o envio inteiro.
        Cada destinatário é avaliado isoladamente: sem seguimento mútuo
        (RN-22.1), já tem o livro na estante em qualquer status (RN-22.3), par
        com 50 recomendações ativas (RN-22.4) ou recomendação ativa do mesmo
        livro já enviada pelo remetente bloqueiam só aquele destinatário. A
        resposta traz o resultado de cada um, na ordem do pedido; o cliente
        mantém a tela aberta e mostra o motivo quando algum foi bloqueado. Cada
        recomendação criada grava recomendacao.recebida na outbox na mesma
        transação. Rate limiting por leitor (RNF-SEC-18).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CriarRecomendacao' }
      responses:
        '200':
          description: Resultado do envio por destinatário.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoRecomendacao' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '422':
          description: >-
            O livro é pessoal (RF-REC-06, RN-22.5). Código
            ENTIDADE_NAO_PROCESSAVEL.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /recomendacoes/candidatos:
    get:
      tags: [recomendacoes]
      summary: Lista os mútuos do leitor que podem receber um livro
      operationId: listarCandidatosARecomendacao
      x-implementation-status: implemented
      description: >-
        Devolve todos os leitores com seguimento mútuo do leitor autenticado,
        ordenados por nomeExibicao, para a busca local da tela Recomendar. Cada
        um informa se já tem o livro na estante e se o par atingiu o limite de
        recomendações ativas; o cliente mostra a linha desabilitada com o motivo.
        Livro pessoal responde 422 e livro inexistente 404. A lista é limitada
        a 500 leitores; seguimento mútuo é uma relação pequena por natureza.
      parameters:
        - name: livroId
          in: query
          required: true
          description: Livro oficial que será recomendado.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Mútuos do leitor com a situação de cada um para o livro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidatos' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422':
          description: O livro é pessoal. Código ENTIDADE_NAO_PROCESSAVEL.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /recomendacoes/recebidas:
    get:
      tags: [recomendacoes]
