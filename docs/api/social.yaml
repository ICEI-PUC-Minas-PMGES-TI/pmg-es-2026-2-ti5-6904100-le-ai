openapi: 3.0.3
info:
  title: Lê Ai - social
  version: 0.1.0
  description: >-
    Contrato do serviço **social**. O serviço mantém a projeção do feed,
    interações em atividades e notificações in-app. As operações de F-FEED e
    F-NOT do Período 1 estão implementadas. A exclusão de comentário
    pertence a F-SOCIAL-2 (Período 2) e aparece apenas para tornar explícito o
    contrato futuro e sua regra de propriedade. As listas de livros pertencem a
    F-LST (Período 2); o contrato foi publicado antes da implementação para
    orientar acervo, web e mobile.

    Atividades e notificações são criadas exclusivamente por consumidores
    idempotentes de eventos do broker. Não há endpoint HTTP público de ingestão.
    Todas as rotas de domínio exigem JWT e validam autorização, visibilidade e
    propriedade no servidor; conhecer um UUID não concede acesso.
  x-implementation-status:
    implemented:
      - GET /health
      - GET /feed
      - GET /atividades/{atividadeId}
      - POST /atividades/{atividadeId}/curtir
      - DELETE /atividades/{atividadeId}/curtir
      - POST /atividades/{atividadeId}/comentarios
      - GET /atividades/{atividadeId}/comentarios
      - GET /comentarios/{comentarioRaizId}/respostas
      - PATCH /comentarios/{comentarioId}
      - DELETE /comentarios/{comentarioId}
      - GET /notificacoes
      - POST /notificacoes/marcar-lidas
    planned-periodo-2:
      - POST /listas
      - GET /listas/{listaId}
      - PATCH /listas/{listaId}
      - DELETE /listas/{listaId}
      - GET /listas/{listaId}/livros
      - POST /listas/{listaId}/livros
      - DELETE /listas/{listaId}/livros/{livroId}
      - PUT /listas/{listaId}/livros/{itemId}/posicao
      - GET /perfis/{usuarioId}/listas
      - GET /me/listas
x-database-contracts:
  - name: v_atividade_livro_pessoal_v1
    x-implementation-status: implemented
    description: >-
      Comprova a via feed para livro pessoal. Expõe somente atividades ativas;
      o consumidor ainda precisa revalidar seguimento aceito, autoria e vínculo
      entre atividade e livro.
    columns: [atividade_id, dono_id, livro_id]
  - name: v_lista_livro_pessoal_v1
    x-implementation-status: planned-periodo-2
    description: >-
      Comprova a via lista para livro pessoal (RN-15, segunda via). Expõe um
      par lista/livro por item de lista ativa; lista excluída sai da VIEW na
      mesma transação. A VIEW existe no banco desde a migration do modelo
      social; o consumo em acervo entra com F-LST. O consumidor ainda precisa
      revalidar o vínculo lista, dono e livro e a privacidade do dono (RN-08):
      perfil público libera qualquer leitor autenticado; perfil privado exige
      seguimento aceito. Diferente da via feed, seguir não é exigido quando o
      perfil é público.
    columns: [lista_id, dono_id, livro_id]
x-event-consumers:
  description: >-
    Registros de atividade e notificação são projeções criadas por consumidores
    RabbitMQ. Todo payload é validado por schema versionado antes do
     processamento; a entrega é deduplicada pelo recibo de eventId e o efeito
     usa a unicidade semântica definida pela feature; falhas após as retentativas seguem para DLQ. Estes contratos não
    representam endpoints HTTP.
  atividades:
    x-implementation-status: implemented
    queue: leai.social.feed
    events:
      - leitura.iniciada
      - leitura.retomada
      - leitura.finalizada
      - leitura.abandonada
      - resenha.publicada
      - resenha.excluida
    effect: >-
      Os cinco eventos de publicação criam uma atividade com snapshot mínimo
      de usuário e livro. resenha.excluida remove fisicamente a atividade da
      resenha e, por cascade, suas curtidas e comentários.
    required-envelope-fields:
      [eventId, type, version, occurredAt, correlationId, businessKey, data]
  notificacoes:
    x-implementation-status: implemented
    queue: leai.social.notificacoes
    events:
      - seguidor.novo
      - solicitacao.criada
      - solicitacao.aceita
      - atividade.curtida
      - atividade.comentada
      - comentario.respondido
      - usuario.mencionado
      - leitura.em_risco
      - leitura.expirada
    effect: >-
      Cria uma notificação para destinatarioId. A deduplicação semântica usa
      destinatário, tipo e chave de negócio; para inatividade, inclui leitura,
      versão do ciclo e limiar de 20, 30 ou 40 dias. A notificação guarda um
      snapshot de quem agiu, do livro e da atividade alvo; a frase em pt-BR é
      montada na leitura. O mapa evento → notificação está em
      EventoDeNotificacao, no código do serviço.
    required-envelope-fields:
      [eventId, type, version, occurredAt, correlationId, businessKey, data]
    required-data-fields: [destinatarioId]
  planned-future-events:
    x-implementation-status: planned-after-periodo-1
    events:
      - resenha.curtida
      - recomendacao.recebida
      - lembrete.sequencia
    description: >-
      Só entram no consumidor quando a feature produtora definir nome, schema,
      chave de negócio, retentativa, DLQ e testes. Não são gerados no Período 1.
x-external-actions:
  abandonar-leitura-em-risco:
    x-implementation-status: implemented
    service: leitura
    method: POST
    path: /leituras/{leituraId}/abandonar
    description: >-
      A notificação LEITURA_EM_RISCO fornece leituraId e esta ação. Após
      confirmação explícita no cliente, ele chama diretamente o serviço
      leitura com JWT e a mesma Idempotency-Key. O serviço leitura revalida
      propriedade e estado. O serviço social não altera nem lê tabelas de
      leitura e, portanto, não expõe uma rota de abandono.
servers:
  - url: http://localhost:8081
    description: local
tags:
  - name: feed
    description: Feed cronológico e detalhe de atividade
  - name: interacoes
    description: Curtidas, comentários e respostas
  - name: listas
    description: Listas de livros curadas pelo leitor (F-LST)
  - name: notificacoes
    description: Notificações in-app do leitor autenticado
  - name: health
    description: Sondagem de disponibilidade
security:
  - bearerAuth: []
paths:
  /feed:
    get:
      tags: [feed]
      summary: Lista o feed cronológico do leitor (RF-SOC-09)
      operationId: listarFeed
      x-implementation-status: implemented
      description: >-
        Retorna atividades dos leitores que o solicitante segue, em ordem
        decrescente de criação. A autorização é revalidada a cada consulta:
        deixar de seguir remove as atividades do resultado; perfil suspenso,
        conteúdo privado sem seguimento aceito e atividade cujo livro esteja
        ausente ou inativo não são exibidos. Para livro pessoal, a atividade
        retornada é a referência que habilita a via feed de RN-15.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página do feed em ordem cronológica decrescente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAtividades' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /atividades/{atividadeId}:
    parameters:
      - $ref: '#/components/parameters/AtividadeId'
    get:
      tags: [feed]
      summary: Obtém o detalhe de uma atividade visível
      operationId: obterAtividade
      x-implementation-status: implemented
      description: >-
        Revalida se a atividade ainda integra o feed do solicitante sob RN-08
        e RN-09. Para evitar enumeração, uma atividade existente mas não
        visível responde como não encontrada.
      responses:
        '200':
          description: Atividade visível com snapshot e contadores atuais.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atividade' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /atividades/{atividadeId}/curtir:
    parameters:
      - $ref: '#/components/parameters/AtividadeId'
    post:
      tags: [interacoes]
      summary: Curte uma atividade visível (RF-SOC-11)
      operationId: curtirAtividade
      x-implementation-status: implemented
      description: >-
        Cria no máximo uma curtida por leitor e atividade. Revalida que a
        atividade ainda integra o feed do solicitante e está sujeita a rate
        limiting. Repetir a mesma chave com o mesmo payload devolve o mesmo
        efeito; reutilizá-la em outra operação ou payload responde 409. Após a
        escrita, atividade.curtida é gravado na outbox na mesma transação.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Curtida criada, ou resposta reproduzida pela mesma chave.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoCurtida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
    delete:
      tags: [interacoes]
      summary: Remove a própria curtida de uma atividade (RF-SOC-11)
      operationId: descurtirAtividade
      x-implementation-status: implemented
      description: >-
        Remove somente a curtida pertencente ao leitor autenticado e revalida
        a visibilidade da atividade. Ausência da própria curtida mantém o
        resultado idempotente. Não remove curtida de outro leitor.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Curtida própria ausente após a operação.
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /atividades/{atividadeId}/comentarios:
    parameters:
      - $ref: '#/components/parameters/AtividadeId'
    get:
      tags: [interacoes]
      summary: Lista comentários-raiz de uma atividade
      operationId: listarComentariosRaiz
      x-implementation-status: implemented
      description: >-
        Lista somente comentários-raiz, paginados e ordenados do mais antigo
        para o mais recente. As respostas são consultadas pela rota própria. A
        atividade precisa continuar visível ao solicitante.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de comentários-raiz.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaComentarios' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
    post:
      tags: [interacoes]
      summary: Comenta uma atividade ou responde a um comentário (RF-SOC-12)
      operationId: criarComentario
      x-implementation-status: implemented
      description: >-
        Sem comentarioRespondidoId cria comentário-raiz. Com o campo, cria uma
        resposta. Se o alvo já for resposta, o novo registro fica como irmão
        sob a mesma raiz; o servidor deriva a raiz e usuarioRespondido do alvo,
        sem confiar no texto. No Período 1 o cliente pré-preenche @username,
        mas menção arbitrária ainda não é resolvida. Revalida visibilidade,
        trata o conteúdo como texto e aplica rate limiting. Publica pela outbox
        atividade.comentada ou comentario.respondido, nunca os dois para uma
        resposta ao mesmo destinatário.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CriarComentario' }
      responses:
        '201':
          description: Comentário ou resposta criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comentario' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '422': { $ref: '#/components/responses/RegraNegocioInvalida' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /comentarios/{comentarioRaizId}/respostas:
    parameters:
      - $ref: '#/components/parameters/ComentarioRaizId'
    get:
      tags: [interacoes]
      summary: Lista respostas diretas de um comentário-raiz
      operationId: listarRespostas
      x-implementation-status: implemented
      description: >-
        Paginação por cursor estável. Retorna apenas respostas irmãs sob a raiz,
        inclusive quando foram criadas em resposta a outra resposta. Revalida a
        visibilidade da atividade antes de retornar qualquer comentário.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
      responses:
        '200':
          description: Segmento de respostas e cursor para o próximo segmento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaRespostas' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /comentarios/{comentarioId}:
    parameters:
      - $ref: '#/components/parameters/ComentarioId'
    patch:
      tags: [interacoes]
      summary: Edita um comentário pertencente ao leitor (RF-SOC-13)
      operationId: editarComentario
      x-implementation-status: implemented
      description: >-
        Somente o autor pode editar. Raiz, alvo e nível não mudam (RN-10). As
        menções do texto são reprocessadas: username existente vira menção,
        inexistente continua texto (RN-10.1). usuario.mencionado só sai para
        destinatário que este comentário ainda não notificou, nunca para o
        autor nem para o alvo de comentario.respondido. Menções que notificam
        têm rate limiting próprio (RN-10.3); estourar recusa a edição com 429.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditarComentario' }
      responses:
        '200':
          description: Comentário com o texto novo e as menções resolvidas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comentario' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
    delete:
      tags: [interacoes]
      summary: Exclui um comentário pertencente ao leitor (RF-SOC-13)
      operationId: excluirComentario
      x-implementation-status: implemented
      description: >-
        Somente o autor pode excluir. Exclusão física: excluir comentário-raiz
        remove suas respostas e menções por cascade (RN-10.5); excluir resposta
        remove somente ela. O cliente exige confirmação explícita e o servidor
        não aceita autoria informada pelo cliente.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Comentário próprio excluído.
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /listas:
    post:
      tags: [listas]
      summary: Cria uma lista do leitor (RF-LST-01)
      operationId: criarLista
      x-implementation-status: planned-periodo-2
      description: >-
        Cria uma lista cujo dono é sempre o leitor autenticado; o servidor não
        aceita dono informado pelo cliente. Com livroId, a lista nasce com esse
        livro na posição 1, na mesma transação, para que criar a partir da
        página do livro nunca deixe uma lista sem o livro. O livro precisa
        estar ativo e ser oficial ou livro pessoal do próprio leitor (RN-15.1).
        Título e descrição são texto puro. Sujeito a rate limiting.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CriarLista' }
      responses:
        '201':
          description: Lista criada, ou resposta reproduzida pela mesma chave.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lista' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '422': { $ref: '#/components/responses/RegraNegocioInvalida' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /listas/{listaId}:
    parameters:
      - $ref: '#/components/parameters/ListaId'
    get:
      tags: [listas]
      summary: Obtém os metadados de uma lista visível (RF-LST-04)
      operationId: obterLista
      x-implementation-status: planned-periodo-2
      description: >-
        O dono sempre vê a própria lista. Terceiros veem se o perfil do dono
        é público ou se seguem o dono com solicitação aceita (RN-08). Perfil
        privado sem seguimento responde 403 com mensagem de perfil privado, e
        o cliente mostra o bloco de restrição. Lista inexistente, excluída ou
        de conta suspensa ou em exclusão responde 404. Os itens são
        consultados pela rota própria, paginada.
      responses:
        '200':
          description: Metadados da lista.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lista' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/PerfilPrivado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
    patch:
      tags: [listas]
      summary: Edita título e descrição da própria lista (RF-LST-03)
      operationId: editarLista
      x-implementation-status: planned-periodo-2
      description: >-
        Owner-only. Campo omitido permanece; descricao nula apaga a descrição.
        Lista alheia responde 404, sem confirmar sua existência.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditarLista' }
      responses:
        '200':
          description: Lista atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lista' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
    delete:
      tags: [listas]
      summary: Exclui a própria lista (RF-LST-03)
      operationId: excluirLista
      x-implementation-status: planned-periodo-2
      description: >-
        Owner-only. O cliente exige confirmação explícita (RNF-USA-04). A
        exclusão é lógica: a lista deixa de aparecer em todas as rotas e em
        v_lista_livro_pessoal_v1 na mesma transação, o que encerra na hora a
        via lista para os livros pessoais que ela continha. Lista já excluída
        mantém o resultado idempotente.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Lista própria ausente após a operação.
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /listas/{listaId}/livros:
    parameters:
      - $ref: '#/components/parameters/ListaId'
    get:
      tags: [listas]
      summary: Lista os livros de uma lista visível, na ordem do dono (RF-LST-04)
      operationId: listarLivrosDaLista
      x-implementation-status: planned-periodo-2
      description: >-
        Paginação por cursor estável, em ordem crescente de posição. Aplica a
        mesma visibilidade de obterLista. Livro inativo não é exibido. Em livro
        pessoal visto por terceiro, o link traz via=lista e referenciaId igual
        à lista; o serviço acervo revalida a autorização ao abrir a página, em
        modo consulta (RN-15.3).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
      responses:
        '200':
          description: Segmento de itens e cursor para o próximo segmento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaItens' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/PerfilPrivado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
    post:
      tags: [listas]
      summary: Adiciona um livro à própria lista (RF-LST-02, RF-LST-05)
      operationId: adicionarLivroNaLista
      x-implementation-status: planned-periodo-2
      description: >-
        Owner-only. O livro entra na última posição. Precisa estar ativo e ser
        oficial ou livro pessoal do próprio leitor; livro pessoal de outro
        leitor responde 422 (RN-15.1). Livro já presente não é duplicado nem
        muda de posição: a resposta é 200 com o item existente, para que o
        cliente trate a lista como marcada.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdicionarLivroNaLista' }
      responses:
        '201':
          description: Livro adicionado, ou resposta reproduzida pela mesma chave.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDeLista' }
        '200':
          description: O livro já estava na lista; item existente, sem alteração.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDeLista' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '422': { $ref: '#/components/responses/RegraNegocioInvalida' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /listas/{listaId}/livros/{livroId}:
    parameters:
      - $ref: '#/components/parameters/ListaId'
      - $ref: '#/components/parameters/LivroId'
    delete:
      tags: [listas]
      summary: Remove um livro da própria lista (RF-LST-02)
      operationId: removerLivroDaLista
      x-implementation-status: planned-periodo-2
      description: >-
        Owner-only. Os itens seguintes sobem uma posição na mesma transação.
        Livro ausente da lista mantém o resultado idempotente. Não pede
        confirmação: o livro continua no acervo e na estante.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Livro ausente da lista após a operação.
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /listas/{listaId}/livros/{itemId}/posicao:
    parameters:
      - $ref: '#/components/parameters/ListaId'
      - $ref: '#/components/parameters/ItemId'
    put:
      tags: [listas]
      summary: Move um livro para outra posição da própria lista (RF-LST-02)
      operationId: moverLivroNaLista
      x-implementation-status: planned-periodo-2
      description: >-
        Owner-only. Move um item por vez, o que funciona com a lista paginada,
        com arrastar no mobile e com os controles de subir e descer da web. Os
        itens entre a posição antiga e a nova se deslocam uma casa, em uma
        transação: nunca fica ordem parcial. Posição fora de 1 até a
        quantidade de livros responde 400. Item de outra lista responde 404.
        Mover para a posição atual mantém o resultado.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoverLivroNaLista' }
      responses:
        '200':
          description: Item na nova posição.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDeLista' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /perfis/{usuarioId}/listas:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    get:
      tags: [listas]
      summary: Lista as listas de um leitor (RF-LST-04, RF-SOC-02)
      operationId: listarListasDoPerfil
      x-implementation-status: planned-periodo-2
      description: >-
        Índice das listas ativas do leitor, da alterada mais recentemente para
        a mais antiga, com contagem e até três capas por lista. Aplica RN-08:
        o próprio leitor e perfis públicos são visíveis; perfil privado sem
        seguimento aceito responde 403. Conta inexistente, suspensa ou em
        exclusão responde 404.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de listas do leitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaListas' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/PerfilPrivado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /me/listas:
    get:
      tags: [listas]
      summary: Lista as listas do próprio leitor, marcando as que contêm um livro
      operationId: listarMinhasListas
      x-implementation-status: planned-periodo-2
      description: >-
        Alimenta o sheet Adicionar à lista. Mesma ordem e forma de
        listarListasDoPerfil para o próprio leitor; com livroId, cada lista
        traz contemLivro. Sem livroId, contemLivro é omitido.
      parameters:
        - name: livroId
          in: query
          required: false
          description: Livro da página de origem do sheet.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de listas do leitor autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaListas' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /notificacoes:
    get:
      tags: [notificacoes]
      summary: Lista as notificações do leitor (RF-NOT-02)
      operationId: listarNotificacoes
      x-implementation-status: implemented
      description: >-
        Lista somente notificações cujo destinatário é o leitor autenticado, em
        ordem cronológica decrescente. Inclui estado lida/não lida e a contagem
        total de não lidas para o badge. Notificações de conta suspensa ou
        conteúdo que perdeu visibilidade não expõem o snapshot ao cliente.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de notificações do leitor autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaNotificacoes' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /notificacoes/marcar-lidas:
    post:
      tags: [notificacoes]
      summary: Marca notificações como lidas, individualmente ou em lote (RF-NOT-03)
      operationId: marcarNotificacoesLidas
      x-implementation-status: implemented
      description: >-
        Com modo SELECIONADAS, ids pode conter um ou vários UUIDs; um UUID cobre
        a marcação individual. Com modo TODAS, ids deve ser omitido e todas as
        notificações ainda não lidas do leitor são marcadas. Se algum id não
        existe ou pertence a outro destinatário, o servidor responde 404, sem
        alterar nenhuma notificação do lote e sem revelar qual id falhou. A
        operação é idempotente: notificação já lida continua lida.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarcarLidas' }
      responses:
        '200':
          description: Estado de leitura atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoMarcarLidas' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /health:
    get:
      security: []
      tags: [health]
      summary: Health check do serviço (RNF-OBS-02)
      operationId: verificarSaude
      x-implementation-status: implemented
      description: Retorna 200 quando o serviço está de pé e o banco responde.
      responses:
        '200':
          description: Serviço e banco saudáveis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503': { $ref: '#/components/responses/Indisponivel' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso de curta duração emitido pelo serviço identidade.
  parameters:
    AtividadeId:
      name: atividadeId
      in: path
      required: true
      description: UUID não sequencial da atividade.
      schema: { type: string, format: uuid }
    ComentarioRaizId:
      name: comentarioRaizId
      in: path
      required: true
      description: UUID de um comentário-raiz da atividade.
      schema: { type: string, format: uuid }
    ComentarioId:
      name: comentarioId
      in: path
      required: true
      description: UUID não sequencial do comentário ou resposta.
      schema: { type: string, format: uuid }
    ListaId:
      name: listaId
      in: path
      required: true
      description: UUID não sequencial da lista.
      schema: { type: string, format: uuid }
    LivroId:
      name: livroId
      in: path
      required: true
      description: UUID do livro no serviço acervo.
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      description: UUID do item da lista, retornado em ItemDeLista.id.
      schema: { type: string, format: uuid }
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      description: UUID do leitor no serviço identidade.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      description: Número da página, iniciado em zero.
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      required: false
      description: Itens por página. O servidor impõe máximo de 50 (RNF-DES-02).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco retornado em proximoCursor; omita na primeira consulta.
      schema:
        type: string
        maxLength: 512
    CursorLimit:
      name: limit
      in: query
      required: false
      description: Itens por segmento. O servidor impõe máximo de 50 (RNF-DES-02).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID único por intenção de escrita. A mesma chave e o mesmo payload
        reproduzem a resposta original; a chave reutilizada com payload ou
        operação diferente responde 409. A chave não substitui autenticação,
        autorização, propriedade ou rate limiting.
      schema:
        type: string
        format: uuid
  responses:
    RequisicaoInvalida:
      description: Parâmetro, corpo ou combinação de campos inválida.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroValidacao' }
    NaoAutenticado:
      description: Token ausente, inválido ou expirado.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Proibido:
      description: O leitor está autenticado, mas não é dono do recurso.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    PerfilPrivado:
      description: >-
        O perfil do dono é privado e o leitor não o segue com solicitação
        aceita (RN-08). Código ACESSO_NEGADO, com mensagem de perfil privado.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            codigo: ACESSO_NEGADO
            mensagem: Este perfil é privado. Siga para ver as listas.
            correlationId: 3f1c9a52-7d7e-4c2b-9a0e-5b2f1d8c6e40
    NaoEncontrado:
      description: >-
        Recurso inexistente, não pertencente ao leitor ou não visível. A
        resposta não confirma a existência de recurso alheio.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    ConflitoIdempotencia:
      description: Idempotency-Key já usada com outro payload ou operação.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    RegraNegocioInvalida:
      description: A entrada é válida, mas viola uma regra de negócio.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroValidacao' }
    LimiteExcedido:
      description: Limite de ação social excedido (RNF-SEC-18).
      headers:
        Retry-After:
          description: Segundos até uma nova tentativa.
          schema: { type: integer, minimum: 1 }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Indisponivel:
      description: Serviço ou dependência temporariamente indisponível.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
  headers:
    CorrelationId:
      description: UUID de correlação da requisição, propagado entre serviços e eventos.
      schema: { type: string, format: uuid }
  schemas:
    Health:
      type: object
      required: [status, service, time]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        service:
          type: string
          enum: [social]
          example: social
        time: { type: string, format: date-time }
    AutorSnapshot:
      type: object
      description: Snapshot capturado no evento; não exige hidratação síncrona do perfil.
      required: [id, username, nomeExibicao]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, example: marinableu }
        nomeExibicao: { type: string, example: Marina Beltrão }
        avatarUrl:
          type: string
          format: uri
          nullable: true
    LivroSnapshot:
      type: object
      description: Snapshot mínimo do livro no momento do fato de leitura.
      required: [id, tipo, titulo, autor]
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [OFICIAL, PESSOAL]
        titulo: { type: string, example: Torto arado }
        autor:
          type: string
          nullable: true
          example: Itamar Vieira Junior
          description: >-
            Nulo em livro oficial sem autor (LivroSnapshot.autor do common-v1,
            desde 27/09/2026). O cliente esconde a linha do autor.
        capaUrl:
          type: string
          format: uri
          nullable: true
        link:
          allOf:
            - $ref: '#/components/schemas/LinkLivro'
          description: >-
            Em livro pessoal contém via=feed e referenciaId igual à atividade;
            o serviço acervo revalida a autorização ao abrir a página.
    LinkLivro:
      type: object
      required: [livroId, via]
      properties:
        livroId: { type: string, format: uuid }
        via:
          type: string
          enum: [catalogo, feed, lista]
          description: >-
            feed nas atividades; lista nos itens de lista (F-LST). catalogo
            para livro oficial.
        referenciaId:
          type: string
          format: uuid
          nullable: true
          description: Atividade na via feed; lista na via lista; nulo em catalogo.
    ResenhaSnapshot:
      type: object
      nullable: true
      required: [id, texto, spoiler]
      properties:
        id: { type: string, format: uuid }
        texto:
          type: string
          maxLength: 5000
          description: Texto cru; o cliente aplica escape ao renderizar.
        spoiler: { type: boolean }
        nota:
          type: number
          nullable: true
          minimum: 0
          maximum: 5
          multipleOf: 0.5
          description: Nota atual do autor para o livro resenhado; nula quando ele não deu nota.
    Atividade:
      type: object
      required:
        - id
        - tipo
        - autor
        - livro
        - criadoEm
        - totalCurtidas
        - totalComentarios
        - curtidaPeloSolicitante
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum:
            - LEITURA_INICIADA
            - LEITURA_RETOMADA
            - LEITURA_FINALIZADA
            - LEITURA_ABANDONADA
            - RESENHA_PUBLICADA
        autor: { $ref: '#/components/schemas/AutorSnapshot' }
        livro: { $ref: '#/components/schemas/LivroSnapshot' }
        resenha: { $ref: '#/components/schemas/ResenhaSnapshot' }
        criadoEm: { type: string, format: date-time }
        totalCurtidas: { type: integer, minimum: 0 }
        totalComentarios: { type: integer, minimum: 0 }
        curtidaPeloSolicitante: { type: boolean }
    PaginaAtividades:
      type: object
      required: [itens, pagina, tamanho, totalItens, totalPaginas, ultima]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Atividade' }
        pagina: { type: integer, minimum: 0 }
        tamanho: { type: integer, minimum: 1, maximum: 50 }
        totalItens: { type: integer, format: int64, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
        ultima: { type: boolean }
    EstadoCurtida:
      type: object
      required: [atividadeId, curtida, totalCurtidas]
      properties:
        atividadeId: { type: string, format: uuid }
        curtida: { type: boolean, enum: [true] }
        totalCurtidas: { type: integer, minimum: 1 }
    CriarComentario:
      type: object
      required: [texto]
      additionalProperties: false
      properties:
        texto:
          type: string
          minLength: 1
          maxLength: 2000
          description: Texto puro. HTML não é interpretado.
          example: '@marinableu Também gostei muito desse final.'
        comentarioRespondidoId:
          type: string
          format: uuid
          description: >-
            Omitido para comentário-raiz. Pode apontar para raiz ou resposta; o
            servidor deriva a raiz e o usuário respondido.
    EditarComentario:
      type: object
      required: [texto]
      additionalProperties: false
      properties:
        texto:
          type: string
          minLength: 1
          maxLength: 2000
          description: Texto puro. HTML não é interpretado.
    Mencao:
      type: object
      required: [posicao, comprimento, usuarioId, username]
      description: >-
        Menção resolvida: o trecho [posicao, posicao + comprimento) do texto,
        em unidades UTF-16, é desenhado como link para o perfil. Conta que sai
        de v_perfil_referencia_v1 (suspensa, exclusão pendente) some daqui e a
        menção volta a ser texto comum.
      properties:
        posicao: { type: integer, minimum: 0 }
        comprimento: { type: integer, minimum: 2 }
        usuarioId: { type: string, format: uuid }
        username: { type: string }
    Comentario:
      type: object
      required:
        - id
        - atividadeId
        - autor
        - texto
        - mencoes
        - nivel
        - criadoEm
        - pertenceAoSolicitante
        - editado
      properties:
        id: { type: string, format: uuid }
        atividadeId: { type: string, format: uuid }
        comentarioRaizId:
          type: string
          format: uuid
          nullable: true
          description: Ausente em raiz; nas respostas identifica a única raiz.
        comentarioRespondidoId:
          type: string
          format: uuid
          nullable: true
          description: Alvo contextual da resposta, mesmo quando é outra resposta.
        usuarioRespondido:
          allOf:
            - $ref: '#/components/schemas/AutorSnapshot'
          nullable: true
        autor: { $ref: '#/components/schemas/AutorSnapshot' }
        texto:
          type: string
          description: Texto puro; deve ser renderizado com escape.
        mencoes:
          type: array
          description: Menções resolvidas, em ordem de posição.
          items: { $ref: '#/components/schemas/Mencao' }
        nivel:
          type: string
          enum: [RAIZ, RESPOSTA]
        totalRespostas:
          type: integer
          minimum: 0
          description: Presente em comentário-raiz.
        pertenceAoSolicitante:
          type: boolean
          description: Informa se o leitor pode editar e excluir (owner-only).
        editado:
          type: boolean
          description: Texto alterado depois de publicado; criadoEm não muda.
        criadoEm: { type: string, format: date-time }
        atualizadoEm:
          type: string
          format: date-time
          nullable: true
    PaginaComentarios:
      type: object
      required: [itens, pagina, tamanho, totalItens, totalPaginas, ultima]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Comentario' }
        pagina: { type: integer, minimum: 0 }
        tamanho: { type: integer, minimum: 1, maximum: 50 }
        totalItens: { type: integer, format: int64, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
        ultima: { type: boolean }
    ListaRespostas:
      type: object
      required: [itens, temMais]
      properties:
        itens:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Comentario' }
        proximoCursor:
          type: string
          nullable: true
          description: Cursor opaco; ausente quando temMais é falso.
        temMais: { type: boolean }
    TipoNotificacao:
      type: string
      description: >-
        Tipos produzidos no Período 1 e a menção de F-SOCIAL-2. Curtida em
        resenha, recomendação e lembrete de sequência dependem de features
        posteriores.
      enum:
        - NOVO_SEGUIDOR
        - SOLICITACAO_CRIADA
        - SOLICITACAO_ACEITA
        - ATIVIDADE_CURTIDA
        - ATIVIDADE_COMENTADA
        - COMENTARIO_RESPONDIDO
        - USUARIO_MENCIONADO
        - LEITURA_EM_RISCO
        - LEITURA_EXPIRADA
      x-planned-future-values:
        - RESENHA_CURTIDA
        - RECOMENDACAO_RECEBIDA
        - LEMBRETE_SEQUENCIA
    AcaoNotificacao:
      type: object
      nullable: true
      description: Presente somente quando a notificação oferece ação direta.
      required: [tipo, rotulo, service, method, path, recursoId, requerConfirmacao]
      properties:
        tipo:
          type: string
          enum: [ABANDONAR_LEITURA]
        rotulo:
          type: string
          example: Abandonar leitura
        service:
          type: string
          enum: [leitura]
        method:
          type: string
          enum: [POST]
        path:
          type: string
          enum: ['/leituras/{leituraId}/abandonar']
        recursoId:
          type: string
          format: uuid
          description: leituraId que substitui o parâmetro do path.
        requerConfirmacao:
          type: boolean
          enum: [true]
    Notificacao:
      type: object
      required: [id, tipo, mensagem, lida, criadoEm]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoNotificacao' }
        mensagem:
          type: string
          description: Texto em pt-BR sem detalhe técnico.
          example: Sua leitura está sem atividade há 20 dias.
        ator:
          allOf:
            - $ref: '#/components/schemas/AutorSnapshot'
          nullable: true
        atividadeId:
          type: string
          format: uuid
          nullable: true
        comentarioId:
          type: string
          format: uuid
          nullable: true
        leituraId:
          type: string
          format: uuid
          nullable: true
        limiarDias:
          type: integer
          enum: [20, 30, 40]
          nullable: true
        livro:
          allOf:
            - $ref: '#/components/schemas/LivroDaNotificacao'
          nullable: true
        acao: { $ref: '#/components/schemas/AcaoNotificacao' }
        lida: { type: boolean }
        lidaEm:
          type: string
          format: date-time
          nullable: true
        criadoEm: { type: string, format: date-time }
    LivroDaNotificacao:
      type: object
      description: >-
        Snapshot do livro nas notificações de inatividade (LEITURA_EM_RISCO e
        LEITURA_EXPIRADA): título para a confirmação de abandono e id/tipo
        para o destino da notificação.
      required: [id, tipo, titulo]
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [oficial, pessoal]
        titulo: { type: string, example: O Avesso da Pele }
    PaginaNotificacoes:
      type: object
      required:
        [itens, pagina, tamanho, totalItens, totalPaginas, ultima, totalNaoLidas]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Notificacao' }
        pagina: { type: integer, minimum: 0 }
        tamanho: { type: integer, minimum: 1, maximum: 50 }
        totalItens: { type: integer, format: int64, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
        ultima: { type: boolean }
        totalNaoLidas: { type: integer, format: int64, minimum: 0 }
    MarcarLidas:
      type: object
      required: [modo]
      additionalProperties: false
      properties:
        modo:
          type: string
          enum: [SELECIONADAS, TODAS]
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
          description: >-
            Obrigatório em SELECIONADAS e proibido em TODAS. Um item representa
            marcação individual; até 100 itens formam o lote selecionado.
      description: >-
        Regra condicional validada pelo servidor: SELECIONADAS exige ids;
        TODAS não aceita ids.
    ResultadoMarcarLidas:
      type: object
      required: [marcadas, totalNaoLidas]
      properties:
        marcadas:
          type: integer
          minimum: 0
          description: Quantidade alterada nesta operação.
        totalNaoLidas: { type: integer, format: int64, minimum: 0 }
    CriarLista:
      type: object
      required: [titulo]
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 80
          description: Texto puro, sem espaço só; HTML não é interpretado.
          example: Romances do sertão
        descricao:
          type: string
          nullable: true
          maxLength: 300
          description: Texto puro. Vazio ou nulo significa sem descrição.
        livroId:
          type: string
          format: uuid
          description: >-
            Opcional. Cria a lista já com este livro na posição 1, na mesma
            transação.
    EditarLista:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 80
        descricao:
          type: string
          nullable: true
          maxLength: 300
          description: Nulo apaga a descrição; omitido mantém.
    AdicionarLivroNaLista:
      type: object
      required: [livroId]
      additionalProperties: false
      properties:
        livroId: { type: string, format: uuid }
    MoverLivroNaLista:
      type: object
      required: [posicao]
      additionalProperties: false
      properties:
        posicao:
          type: integer
          minimum: 1
          description: Nova posição, de 1 até a quantidade de livros da lista.
    DonoDaLista:
      type: object
      description: Dados públicos atuais do dono, lidos de v_perfil_referencia_v1.
      required: [id, username, nomeExibicao]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, example: marinableu }
        nomeExibicao: { type: string, example: Marina Beltrão }
        avatarUrl:
          type: string
          format: uri
          nullable: true
    Lista:
      type: object
      required:
        - id
        - dono
        - titulo
        - quantidadeLivros
        - pertenceAoSolicitante
        - criadaEm
        - atualizadaEm
      properties:
        id: { type: string, format: uuid }
        dono: { $ref: '#/components/schemas/DonoDaLista' }
        titulo:
          type: string
          description: Texto puro; o cliente aplica escape ao renderizar.
        descricao:
          type: string
          nullable: true
          description: Texto puro; o cliente aplica escape ao renderizar.
        quantidadeLivros: { type: integer, minimum: 0 }
        pertenceAoSolicitante:
          type: boolean
          description: Libera no cliente editar, excluir, adicionar, remover e mover.
        criadaEm: { type: string, format: date-time }
        atualizadaEm:
          type: string
          format: date-time
          description: Muda a cada edição, inclusão, remoção ou movimento de livro.
    CapaDaLista:
      type: object
      required: [livroId, tipo, titulo]
      properties:
        livroId: { type: string, format: uuid }
        tipo:
          type: string
          enum: [OFICIAL, PESSOAL]
        titulo:
          type: string
          description: Usado pelo placeholder quando não há capa.
        capaUrl:
          type: string
          format: uri
          nullable: true
    ListaResumo:
      type: object
      required: [id, titulo, quantidadeLivros, capas, atualizadaEm]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        descricao:
          type: string
          nullable: true
        quantidadeLivros: { type: integer, minimum: 0 }
        capas:
          type: array
          maxItems: 3
          description: Os três primeiros livros ativos pela ordem do dono.
          items: { $ref: '#/components/schemas/CapaDaLista' }
        atualizadaEm: { type: string, format: date-time }
        contemLivro:
          type: boolean
          description: Presente somente em listarMinhasListas com livroId.
    PaginaListas:
      type: object
      required: [itens, pagina, tamanho, totalItens, totalPaginas, ultima]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/ListaResumo' }
        pagina: { type: integer, minimum: 0 }
        tamanho: { type: integer, minimum: 1, maximum: 50 }
        totalItens: { type: integer, format: int64, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
        ultima: { type: boolean }
    LivroDaLista:
      type: object
      description: >-
        Dados atuais do livro, lidos de v_livro_referencia_v1 na consulta; não
        é snapshot.
      required: [id, tipo, titulo, link]
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [OFICIAL, PESSOAL]
        titulo: { type: string }
        autor:
          type: string
          nullable: true
          description: Nulo em livro sem autor; o cliente esconde a linha.
        capaUrl:
          type: string
          format: uri
          nullable: true
        link:
          allOf:
            - $ref: '#/components/schemas/LinkLivro'
          description: >-
            catalogo em livro oficial. Em livro pessoal, via=lista e
            referenciaId igual à lista; o acervo dispensa a via quando quem
            abre é o dono do livro.
    ItemDeLista:
      type: object
      required: [id, listaId, livro, posicao, adicionadoEm]
      properties:
        id: { type: string, format: uuid }
        listaId: { type: string, format: uuid }
        livro: { $ref: '#/components/schemas/LivroDaLista' }
        posicao:
          type: integer
          minimum: 1
          description: Posição contínua, sem buracos, a partir de 1.
        adicionadoEm: { type: string, format: date-time }
    ListaItens:
      type: object
      required: [itens, temMais]
      properties:
        itens:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ItemDeLista' }
        proximoCursor:
          type: string
          nullable: true
          description: Cursor opaco; ausente quando temMais é falso.
        temMais: { type: boolean }
    ViolacaoCampo:
      type: object
      required: [campo, mensagem]
      properties:
        campo: { type: string, example: size }
        mensagem: { type: string, example: deve ser menor ou igual a 50 }
    Erro:
      type: object
      description: Corpo de erro padronizado (RNF-ERR-01), em pt-BR e sem detalhe técnico.
      required: [codigo, mensagem, correlationId]
      properties:
        codigo:
          type: string
          example: RECURSO_NAO_ENCONTRADO
        mensagem:
          type: string
          example: Não encontramos o recurso solicitado ou você não pode acessá-lo.
        correlationId:
          type: string
          format: uuid
    ErroValidacao:
      allOf:
        - $ref: '#/components/schemas/Erro'
        - type: object
          properties:
            violacoes:
              type: array
              items: { $ref: '#/components/schemas/ViolacaoCampo' }
