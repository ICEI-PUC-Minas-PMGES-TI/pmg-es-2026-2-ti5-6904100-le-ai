      operationId: listarRecomendacoesRecebidas
      x-implementation-status: implemented
      description: >-
        Somente recomendações cujo destinatário é o leitor autenticado, ativas
        e não expiradas (RN-22.9, 90 dias), da mais recente para a mais antiga.
        O mesmo livro recomendado por remetentes diferentes aparece uma vez por
        remetente (RN-22.7). Recomendações continuam visíveis mesmo que o
        seguimento mútuo se desfaça depois do envio (RN-22.15). Remetente que
        saiu de v_perfil_referencia_v1 (suspenso ou em exclusão) some da lista.
        Alimenta a seção P2P da aba Recomendações, que funciona sem a fonte
        algorítmica.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de recomendações recebidas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaRecomendacoes' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /recomendacoes/{recomendacaoId}:
    parameters:
      - $ref: '#/components/parameters/RecomendacaoId'
    delete:
      tags: [recomendacoes]
      summary: Descarta uma recomendação recebida (RF-REC-15, RN-22.11)
      operationId: descartarRecomendacao
      x-implementation-status: implemented
      description: >-
        Exclusivo do destinatário autenticado, sem motivo e sem avisar o
        remetente. Recomendação inexistente, expirada ou de outro leitor,
        inclusive do próprio remetente, responde 404 sem confirmar a existência.
        Repetir a mesma Idempotency-Key reproduz o 204.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Recomendação descartada.
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /notificacoes:
    get:
      tags: [notificacoes]
      summary: Lista as notificações do leitor (RF-NOT-02)
      operationId: listarNotificacoes
      x-implementation-status: implemented
      description: >-
        Lista somente notificações cujo destinatário é o leitor autenticado, em
        ordem cronológica decrescente. Inclui estado lida/não lida e a contagem
        total de não lidas para o badge. Notificações de conta suspensa ou
        conteúdo que perdeu visibilidade não expõem o snapshot ao cliente.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de notificações do leitor autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaNotificacoes' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /notificacoes/marcar-lidas:
    post:
      tags: [notificacoes]
      summary: Marca notificações como lidas, individualmente ou em lote (RF-NOT-03)
      operationId: marcarNotificacoesLidas
      x-implementation-status: implemented
      description: >-
        Com modo SELECIONADAS, ids pode conter um ou vários UUIDs; um UUID cobre
        a marcação individual. Com modo TODAS, ids deve ser omitido e todas as
        notificações ainda não lidas do leitor são marcadas. Se algum id não
        existe ou pertence a outro destinatário, o servidor responde 404, sem
        alterar nenhuma notificação do lote e sem revelar qual id falhou. A
        operação é idempotente: notificação já lida continua lida.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarcarLidas' }
      responses:
        '200':
          description: Estado de leitura atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoMarcarLidas' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /notificacoes/tempo-real:
    get:
      tags: [notificacoes]
      summary: Canal SSE de notificações em tempo real (RF-NOT-06)
      operationId: abrirCanalDeNotificacoes
      x-implementation-status: implemented
      description: >-
        Server-Sent Events (`text/event-stream`) do leitor autenticado. O token
        vai no cabeçalho `Authorization`, nunca na URL. Protocolo:


        - `event: sincronizacao` — primeiro evento do canal; `data` é
        `SincronizacaoTempoReal`. Depois de uma reconexão, o cliente recarrega a
        primeira página de `GET /notificacoes` e mescla por `id`.

        - `event: notificacao` — uma notificação nova do leitor; `id` é o id da
        notificação e `data` é `NotificacaoTempoReal`.

        - `: heartbeat` — comentário a cada 25 s para a conexão não ser cortada
        por ociosidade; o cliente ignora.


        O servidor encerra o canal quando o token expira (o cliente renova a
        sessão e reconecta com backoff) e quando o serviço para ou hiberna. O
        canal é só entrega antecipada: a lista paginada continua sendo a fonte
        de verdade e nada se perde enquanto ele está fechado.
      responses:
        '200':
          description: Canal aberto; eventos conforme a descrição.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /denuncias:
    post:
      tags: [moderacao]
      summary: Denuncia uma resenha ou um comentário (RF-MOD-01)
      operationId: criarDenuncia
      x-implementation-status: implemented
      description: >-
        O motivo é um único texto livre, obrigatório, com até 500 caracteres
        contados em code points, sem enum nem descrição separada. O servidor
        confere o acesso atual ao alvo: comentário pela visibilidade da
        atividade (RN-08/RN-09); resenha de livro oficial por perfil público
        ou seguimento aceito; resenha de livro pessoal só pela via de RN-15.4
        (`via` e `referenciaId`, na mesma regra de reagir à resenha). Sem
        acesso, 404, igual a inexistente. Se o leitor já tem denúncia pendente
        sobre o mesmo alvo, a resposta é 200 com essa denúncia, sem criar outra
        nem trocar o motivo. Rate limiting por leitor (10 por minuto) e por IP
        (RNF-SEC-18).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CriarDenuncia' }
      responses:
        '201':
          description: Denúncia registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Denuncia' }
        '200':
          description: O leitor já tinha denúncia pendente sobre o alvo; ela é devolvida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Denuncia' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403':
          description: >-
            A conta de quem denuncia está fora da VIEW de perfil (suspensa ou
            em exclusão). Código ACESSO_NEGADO.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '422':
          description: >-
            O conteúdo é do próprio leitor. Código ENTIDADE_NAO_PROCESSAVEL.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /admin/denuncias:
    get:
      tags: [moderacao]
      summary: Denúncias pendentes, da mais antiga para a mais recente (RF-MOD-02)
      operationId: listarDenunciasPendentes
      x-implementation-status: implemented
      description: >-
        Só o administrador (claim papel igual a admin no token; RNF-SEC-04);
        leitor recebe 403. Paginação por cursor, e não por número de página:
        a fila encolhe a cada ação, e uma página numerada pularia denúncias
        (divergência registrada na F-MOD). Sem total de pendentes. Cada item
        traz o conteúdo inteiro, com spoiler à mostra, o contexto gravado na
        denúncia e remocaoNaoConfirmada quando uma remoção foi pedida ao
        leitura e a confirmação não chegou. Conteúdo excluído pelo autor vem
        com conteudo nulo; pessoa fora da VIEW de perfil, nula.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Página de denúncias pendentes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDenuncias' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /admin/denuncias/{denunciaId}/arquivar:
    parameters:
      - name: denunciaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [moderacao]
      summary: Arquiva a denúncia como improcedente (RF-MOD-03)
      operationId: arquivarDenuncia
      x-implementation-status: implemented
      description: >-
        Fecha só a denúncia escolhida; as outras do mesmo conteúdo continuam
        na fila. Grava o log de auditoria. 409 DENUNCIA_JA_RESOLVIDA se ela já
        foi resolvida; 409 REMOCAO_EM_ANDAMENTO se há remoção do conteúdo
        esperando confirmação do leitura (o painel oferece tentar de novo).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Denúncias fechadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoModeracao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: >-
            DENUNCIA_JA_RESOLVIDA, REMOCAO_EM_ANDAMENTO ou chave de
            idempotência reutilizada com outros dados (CONFLITO).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /admin/denuncias/{denunciaId}/remover:
    parameters:
      - name: denunciaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [moderacao]
      summary: Remove o conteúdo denunciado e fecha as denúncias dele (RF-MOD-03)
      operationId: removerConteudoDenunciado
      x-implementation-status: implemented
      description: >-
        Comentário: apagado aqui, com as respostas (RN-10.5); fecha as
        denúncias dele e das respostas. Resenha: o social chama o comando
        interno autenticado e idempotente do leitura, com chave fixa por
        resenha, fora da transação; confirmada a remoção, fecha as denúncias
        da resenha e dos comentários da atividade dela, apaga a atividade e
        grava um único log, sem recusar. Timeout ou leitura fora do ar deixam
        a denúncia pendente, marcada como remoção não confirmada; repetir com
        a mesma chave não remove duas vezes. Conteúdo já excluído pelo autor
        é 409 CONTEUDO_JA_EXCLUIDO, e o painel oferece arquivar.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Denúncias fechadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoModeracao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: DENUNCIA_JA_RESOLVIDA, CONTEUDO_JA_EXCLUIDO ou CONFLITO.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '503':
          description: O leitura não respondeu ou está sem o segredo. A denúncia continua pendente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '504':
          description: A remoção não foi confirmada a tempo. A denúncia continua pendente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /admin/moderacao/logs:
    get:
      tags: [moderacao]
      summary: Registro de auditoria, da ação mais recente para a mais antiga (RF-MOD-05)
      operationId: listarRegistrosDeModeracao
      x-implementation-status: implemented
      description: >-
        Só o administrador. Autor, ação, alvo e momento, sem o texto removido,
        o motivo nem quem denunciou (RNF-SEC-36). Alvo de conta excluída vem
        anonimizado (RN-23.7). Paginação por cursor.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Página do registro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaRegistrosDeModeracao' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
  /health:
    get:
      security: []
      tags: [health]
      summary: Health check do serviço (RNF-OBS-02)
      operationId: verificarSaude
      x-implementation-status: implemented
      description: Retorna 200 quando o serviço está de pé e o banco responde.
      responses:
        '200':
          description: Serviço e banco saudáveis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503': { $ref: '#/components/responses/Indisponivel' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso de curta duração emitido pelo serviço identidade.
  parameters:
    AtividadeId:
      name: atividadeId
      in: path
      required: true
      description: UUID não sequencial da atividade.
      schema: { type: string, format: uuid }
    ComentarioRaizId:
      name: comentarioRaizId
      in: path
      required: true
      description: UUID de um comentário-raiz da atividade.
      schema: { type: string, format: uuid }
    ComentarioId:
      name: comentarioId
      in: path
      required: true
      description: UUID não sequencial do comentário ou resposta.
      schema: { type: string, format: uuid }
    ListaId:
      name: listaId
      in: path
      required: true
      description: UUID não sequencial da lista.
      schema: { type: string, format: uuid }
    LivroId:
      name: livroId
      in: path
      required: true
      description: UUID do livro no serviço acervo.
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      description: UUID do item da lista, retornado em ItemDeLista.id.
      schema: { type: string, format: uuid }
    RecomendacaoId:
      name: recomendacaoId
      in: path
      required: true
      description: UUID não sequencial da recomendação.
      schema: { type: string, format: uuid }
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      description: UUID do leitor no serviço identidade.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      description: Número da página, iniciado em zero.
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      required: false
      description: Itens por página. O servidor impõe máximo de 50 (RNF-DES-02).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco retornado em proximoCursor; omita na primeira consulta.
      schema:
        type: string
        maxLength: 512
    CursorLimit:
      name: limit
      in: query
      required: false
      description: Itens por segmento. O servidor impõe máximo de 50 (RNF-DES-02).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID único por intenção de escrita. A mesma chave e o mesmo payload
        reproduzem a resposta original; a chave reutilizada com payload ou
        operação diferente responde 409. A chave não substitui autenticação,
        autorização, propriedade ou rate limiting.
      schema:
        type: string
        format: uuid
  responses:
    RequisicaoInvalida:
      description: Parâmetro, corpo ou combinação de campos inválida.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroValidacao' }
    NaoAutenticado:
      description: Token ausente, inválido ou expirado.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Proibido:
      description: O leitor está autenticado, mas não é dono do recurso.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    PerfilPrivado:
      description: >-
        O perfil do dono é privado e o leitor não o segue com solicitação
        aceita (RN-08). Código ACESSO_NEGADO, com mensagem de perfil privado.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            codigo: ACESSO_NEGADO
            mensagem: Este perfil é privado. Siga para ver as listas.
            correlationId: 3f1c9a52-7d7e-4c2b-9a0e-5b2f1d8c6e40
    NaoEncontrado:
      description: >-
        Recurso inexistente, não pertencente ao leitor ou não visível. A
        resposta não confirma a existência de recurso alheio.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    ConflitoIdempotencia:
      description: Idempotency-Key já usada com outro payload ou operação.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    RegraNegocioInvalida:
      description: A entrada é válida, mas viola uma regra de negócio.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroValidacao' }
    LimiteExcedido:
      description: Limite de ação social excedido (RNF-SEC-18).
      headers:
        Retry-After:
          description: Segundos até uma nova tentativa.
          schema: { type: integer, minimum: 1 }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Indisponivel:
      description: Serviço ou dependência temporariamente indisponível.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
  headers:
    CorrelationId:
      description: UUID de correlação da requisição, propagado entre serviços e eventos.
      schema: { type: string, format: uuid }
  schemas:
    Health:
      type: object
      required: [status, service, time]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        service:
          type: string
          enum: [social]
          example: social
        time: { type: string, format: date-time }
    AutorSnapshot:
      type: object
      description: Snapshot capturado no evento; não exige hidratação síncrona do perfil.
      required: [id, username, nomeExibicao]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, example: marinableu }
        nomeExibicao: { type: string, example: Marina Beltrão }
        avatarUrl:
          type: string
          format: uri
          nullable: true
    LivroSnapshot:
      type: object
      description: Snapshot mínimo do livro no momento do fato de leitura.
      required: [id, tipo, titulo, autor]
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [OFICIAL, PESSOAL]
        titulo: { type: string, example: Torto arado }
        autor:
          type: string
          nullable: true
          example: Itamar Vieira Junior
          description: >-
            Nulo em livro oficial sem autor (LivroSnapshot.autor do common-v1,
            desde 27/09/2026). O cliente esconde a linha do autor.
        capaUrl:
          type: string
          format: uri
          nullable: true
        link:
          allOf:
            - $ref: '#/components/schemas/LinkLivro'
          description: >-
            Em livro pessoal contém via=feed e referenciaId igual à atividade;
            o serviço acervo revalida a autorização ao abrir a página.
    LinkLivro:
      type: object
      required: [livroId, via]
      properties:
        livroId: { type: string, format: uuid }
        via:
          type: string
          enum: [catalogo, feed, lista]
          description: >-
            feed nas atividades; lista nos itens de lista (F-LST). catalogo
            para livro oficial.
        referenciaId:
          type: string
          format: uuid
          nullable: true
          description: Atividade na via feed; lista na via lista; nulo em catalogo.
    ResenhaSnapshot:
      type: object
      nullable: true
      required: [id, texto, spoiler]
      properties:
        id: { type: string, format: uuid }
        texto:
          type: string
          maxLength: 5000
          description: Texto cru; o cliente aplica escape ao renderizar.
        spoiler: { type: boolean }
        nota:
          type: number
          nullable: true
          minimum: 0
          maximum: 5
          multipleOf: 0.5
          description: Nota atual do autor para o livro resenhado; nula quando ele não deu nota.
    Atividade:
      type: object
      required:
        - id
        - tipo
        - autor
        - livro
        - criadoEm
        - totalCurtidas
        - totalComentarios
        - curtidaPeloSolicitante
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum:
            - LEITURA_INICIADA
            - LEITURA_RETOMADA
            - LEITURA_FINALIZADA
            - LEITURA_ABANDONADA
            - RESENHA_PUBLICADA
        autor: { $ref: '#/components/schemas/AutorSnapshot' }
        livro: { $ref: '#/components/schemas/LivroSnapshot' }
        resenha: { $ref: '#/components/schemas/ResenhaSnapshot' }
        criadoEm: { type: string, format: date-time }
        totalCurtidas: { type: integer, minimum: 0 }
        totalComentarios: { type: integer, minimum: 0 }
        curtidaPeloSolicitante: { type: boolean }
    PaginaAtividades:
      type: object
      required: [itens, pagina, tamanho, totalItens, totalPaginas, ultima]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Atividade' }
        pagina: { type: integer, minimum: 0 }
        tamanho: { type: integer, minimum: 1, maximum: 50 }
        totalItens: { type: integer, format: int64, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
        ultima: { type: boolean }
    EstadoCurtida:
      type: object
      required: [atividadeId, curtida, totalCurtidas]
      properties:
        atividadeId: { type: string, format: uuid }
        curtida: { type: boolean, enum: [true] }
        totalCurtidas: { type: integer, minimum: 1 }
    CriarComentario:
      type: object
      required: [texto]
      additionalProperties: false
      properties:
        texto:
          type: string
          minLength: 1
          maxLength: 2000
          description: Texto puro. HTML não é interpretado.
          example: '@marinableu Também gostei muito desse final.'
        comentarioRespondidoId:
          type: string
          format: uuid
          description: >-
            Omitido para comentário-raiz. Pode apontar para raiz ou resposta; o
            servidor deriva a raiz e o usuário respondido.
    EditarComentario:
      type: object
      required: [texto]
      additionalProperties: false
      properties:
        texto:
          type: string
          minLength: 1
          maxLength: 2000
          description: Texto puro. HTML não é interpretado.
    Mencao:
      type: object
      required: [posicao, comprimento, usuarioId, username]
      description: >-
        Menção resolvida: o trecho [posicao, posicao + comprimento) do texto,
        em unidades UTF-16, é desenhado como link para o perfil. Conta que sai
        de v_perfil_referencia_v1 (suspensa, exclusão pendente) some daqui e a
        menção volta a ser texto comum.
      properties:
        posicao: { type: integer, minimum: 0 }
        comprimento: { type: integer, minimum: 2 }
        usuarioId: { type: string, format: uuid }
        username: { type: string }
    Comentario:
      type: object
      required:
        - id
        - atividadeId
        - autor
        - texto
        - mencoes
        - nivel
        - criadoEm
        - pertenceAoSolicitante
        - editado
      properties:
        id: { type: string, format: uuid }
        atividadeId: { type: string, format: uuid }
        comentarioRaizId:
          type: string
          format: uuid
          nullable: true
          description: Ausente em raiz; nas respostas identifica a única raiz.
        comentarioRespondidoId:
          type: string
          format: uuid
          nullable: true
          description: Alvo contextual da resposta, mesmo quando é outra resposta.
        usuarioRespondido:
          allOf:
            - $ref: '#/components/schemas/AutorSnapshot'
          nullable: true
        autor: { $ref: '#/components/schemas/AutorSnapshot' }
        texto:
          type: string
          description: Texto puro; deve ser renderizado com escape.
        mencoes:
          type: array
          description: Menções resolvidas, em ordem de posição.
          items: { $ref: '#/components/schemas/Mencao' }
        nivel:
          type: string
          enum: [RAIZ, RESPOSTA]
        totalRespostas:
          type: integer
          minimum: 0
          description: Presente em comentário-raiz.
        pertenceAoSolicitante:
          type: boolean
          description: Informa se o leitor pode editar e excluir (owner-only).
        editado:
          type: boolean
          description: Texto alterado depois de publicado; criadoEm não muda.
        criadoEm: { type: string, format: date-time }
        atualizadoEm:
          type: string
          format: date-time
          nullable: true
    PaginaComentarios:
      type: object
      required: [itens, pagina, tamanho, totalItens, totalPaginas, ultima]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Comentario' }
        pagina: { type: integer, minimum: 0 }
        tamanho: { type: integer, minimum: 1, maximum: 50 }
        totalItens: { type: integer, format: int64, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
        ultima: { type: boolean }
    ListaRespostas:
      type: object
      required: [itens, temMais]
      properties:
        itens:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Comentario' }
        proximoCursor:
          type: string
          nullable: true
          description: Cursor opaco; ausente quando temMais é falso.
        temMais: { type: boolean }
    TipoNotificacao:
      type: string
      description: >-
        Tipos produzidos no Período 1, a menção de F-SOCIAL-2, a curtida em
        resenha de F-AVA-2 e a recomendação recebida de F-REC-P2P. Lembrete de
        sequência depende de feature posterior.
      enum:
        - NOVO_SEGUIDOR
        - SOLICITACAO_CRIADA
        - SOLICITACAO_ACEITA
        - ATIVIDADE_CURTIDA
        - ATIVIDADE_COMENTADA
        - COMENTARIO_RESPONDIDO
        - USUARIO_MENCIONADO
        - LEITURA_EM_RISCO
        - LEITURA_EXPIRADA
        - RECOMENDACAO_RECEBIDA
        - RESENHA_CURTIDA
      x-planned-future-values:
        - LEMBRETE_SEQUENCIA
    AcaoNotificacao:
      type: object
      nullable: true
      description: Presente somente quando a notificação oferece ação direta.
      required: [tipo, rotulo, service, method, path, recursoId, requerConfirmacao]
      properties:
        tipo:
          type: string
          enum: [ABANDONAR_LEITURA]
        rotulo:
          type: string
          example: Abandonar leitura
        service:
          type: string
          enum: [leitura]
        method:
          type: string
          enum: [POST]
        path:
          type: string
          enum: ['/leituras/{leituraId}/abandonar']
        recursoId:
          type: string
          format: uuid
          description: leituraId que substitui o parâmetro do path.
        requerConfirmacao:
          type: boolean
          enum: [true]
    Notificacao:
      type: object
      required: [id, tipo, mensagem, lida, criadoEm]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoNotificacao' }
        mensagem:
          type: string
          description: Texto em pt-BR sem detalhe técnico.
          example: Sua leitura está sem atividade há 20 dias.
        ator:
          allOf:
            - $ref: '#/components/schemas/AutorSnapshot'
          nullable: true
        atividadeId:
          type: string
          format: uuid
          nullable: true
        comentarioId:
          type: string
          format: uuid
          nullable: true
        leituraId:
          type: string
          format: uuid
          nullable: true
        limiarDias:
          type: integer
          enum: [20, 30, 40]
          nullable: true
        livro:
          allOf:
            - $ref: '#/components/schemas/LivroDaNotificacao'
          nullable: true
        recomendacaoMensagem:
          type: string
          maxLength: 280
          nullable: true
          description: >-
            Mensagem do remetente em RECOMENDACAO_RECEBIDA, quando houver.
            Texto puro; o cliente aplica escape ao renderizar.
        acao: { $ref: '#/components/schemas/AcaoNotificacao' }
        lida: { type: boolean }
        lidaEm:
          type: string
          format: date-time
          nullable: true
        criadoEm: { type: string, format: date-time }
    LivroDaNotificacao:
      type: object
      description: >-
        Snapshot do livro nas notificações de inatividade (LEITURA_EM_RISCO e
        LEITURA_EXPIRADA) e na curtida em resenha (RESENHA_CURTIDA): título
        para a confirmação de abandono e para a frase, e id/tipo para o destino
        da notificação (página do livro oficial ou do livro pessoal). Em
        RECOMENDACAO_RECEBIDA, o livro recomendado: a notificação leva à página
        dele (RF-REC-05).
      required: [id, tipo, titulo]
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [oficial, pessoal]
        titulo: { type: string, example: O Avesso da Pele }
    PaginaNotificacoes:
      type: object
      required:
        [itens, pagina, tamanho, totalItens, totalPaginas, ultima, totalNaoLidas]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Notificacao' }
        pagina: { type: integer, minimum: 0 }
        tamanho: { type: integer, minimum: 1, maximum: 50 }
        totalItens: { type: integer, format: int64, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
        ultima: { type: boolean }
        totalNaoLidas: { type: integer, format: int64, minimum: 0 }
    MarcarLidas:
      type: object
      required: [modo]
      additionalProperties: false
      properties:
        modo:
          type: string
          enum: [SELECIONADAS, TODAS]
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
          description: >-
            Obrigatório em SELECIONADAS e proibido em TODAS. Um item representa
            marcação individual; até 100 itens formam o lote selecionado.
      description: >-
        Regra condicional validada pelo servidor: SELECIONADAS exige ids;
        TODAS não aceita ids.
    ResultadoMarcarLidas:
      type: object
      required: [marcadas, totalNaoLidas]
      properties:
        marcadas:
          type: integer
          minimum: 0
          description: Quantidade alterada nesta operação.
        totalNaoLidas: { type: integer, format: int64, minimum: 0 }
    SincronizacaoTempoReal:
      type: object
      description: Dado do evento SSE `sincronizacao`, o primeiro de todo canal aberto.
      required: [totalNaoLidas]
      properties:
        totalNaoLidas: { type: integer, format: int64, minimum: 0 }
    NotificacaoTempoReal:
      type: object
      description: >-
        Dado do evento SSE `notificacao`: a notificação recém-gravada, no mesmo
        formato da lista, e o novo total de não lidas para o badge.
      required: [notificacao, totalNaoLidas]
      properties:
        notificacao: { $ref: '#/components/schemas/Notificacao' }
        totalNaoLidas: { type: integer, format: int64, minimum: 0 }
    CriarRecomendacao:
      type: object
      required: [livroId, destinatarios]
      additionalProperties: false
      properties:
        livroId: { type: string, format: uuid }
        destinatarios:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
        mensagem:
          type: string
          minLength: 1
          maxLength: 280
          nullable: true
          description: >-
            Opcional (RF-REC-03). Texto puro; espaços nas pontas são removidos e
            texto que fica vazio é tratado como ausente.
    ResultadoPorDestinatario:
      type: object
      required: [destinatarioId, status]
      properties:
        destinatarioId: { type: string, format: uuid }
        status:
          type: string
          enum: [CRIADA, BLOQUEADA]
        recomendacaoId:
          type: string
          format: uuid
          nullable: true
          description: Presente quando status é CRIADA.
        motivo:
          type: string
          nullable: true
          enum: [SEM_MUTUO, JA_TEM_LIVRO, LIMITE_ATINGIDO, JA_RECOMENDADO, null]
          description: >-
            Presente quando status é BLOQUEADA. SEM_MUTUO, RN-22.1;
            JA_TEM_LIVRO, RN-22.3; LIMITE_ATINGIDO, 50 ativas no par (RN-22.4);
            JA_RECOMENDADO, o remetente já tem recomendação ativa deste livro
            para o destinatário.
    ResultadoRecomendacao:
      type: object
      required: [resultados, totalCriadas]
      properties:
        resultados:
          type: array
          items: { $ref: '#/components/schemas/ResultadoPorDestinatario' }
        totalCriadas: { type: integer, minimum: 0 }
    CandidatoARecomendacao:
      type: object
      required: [leitor, jaTemLivro, limiteAtingido]
      properties:
        leitor: { $ref: '#/components/schemas/AutorSnapshot' }
        jaTemLivro: { type: boolean }
        limiteAtingido: { type: boolean }
    ListaCandidatos:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/CandidatoARecomendacao' }
    RecomendacaoRecebida:
      type: object
      required: [id, remetente, livro, criadoEm, expiraEm]
      properties:
        id: { type: string, format: uuid }
        remetente: { $ref: '#/components/schemas/AutorSnapshot' }
        livro: { $ref: '#/components/schemas/LivroSnapshot' }
        mensagem:
          type: string
          maxLength: 280
          nullable: true
          description: Texto puro; o cliente aplica escape ao renderizar.
        criadoEm:
          type: string
          format: date-time
          description: Base do tempo relativo, calculado no cliente.
        expiraEm: { type: string, format: date-time }
    PaginaRecomendacoes:
      type: object
      required: [itens, pagina, tamanho, totalItens, totalPaginas, ultima]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/RecomendacaoRecebida' }
        pagina: { type: integer, minimum: 0 }
        tamanho: { type: integer, minimum: 1, maximum: 50 }
        totalItens: { type: integer, format: int64, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
        ultima: { type: boolean }
    CriarLista:
      type: object
      required: [titulo]
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 80
          description: Texto puro, sem espaço só; HTML não é interpretado.
          example: Romances do sertão
        descricao:
          type: string
          nullable: true
          maxLength: 300
          description: Texto puro. Vazio ou nulo significa sem descrição.
        livroId:
          type: string
          format: uuid
          description: >-
            Opcional. Cria a lista já com este livro na posição 1, na mesma
            transação.
    EditarLista:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 80
        descricao:
          type: string
          nullable: true
          maxLength: 300
          description: Nulo apaga a descrição; omitido mantém.
    AdicionarLivroNaLista:
      type: object
      required: [livroId]
      additionalProperties: false
      properties:
        livroId: { type: string, format: uuid }
    MoverLivroNaLista:
      type: object
      required: [posicao]
      additionalProperties: false
      properties:
        posicao:
          type: integer
          minimum: 1
          description: Nova posição, de 1 até a quantidade de livros da lista.
    DonoDaLista:
      type: object
      description: Dados públicos atuais do dono, lidos de v_perfil_referencia_v1.
      required: [id, username, nomeExibicao]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, example: marinableu }
        nomeExibicao: { type: string, example: Marina Beltrão }
        avatarUrl:
          type: string
          format: uri
          nullable: true
    Lista:
      type: object
      required:
        - id
        - dono
        - titulo
        - quantidadeLivros
        - pertenceAoSolicitante
        - criadaEm
        - atualizadaEm
      properties:
        id: { type: string, format: uuid }
        dono: { $ref: '#/components/schemas/DonoDaLista' }
        titulo:
          type: string
          description: Texto puro; o cliente aplica escape ao renderizar.
        descricao:
          type: string
          nullable: true
          description: Texto puro; o cliente aplica escape ao renderizar.
        quantidadeLivros: { type: integer, minimum: 0 }
        pertenceAoSolicitante:
          type: boolean
          description: Libera no cliente editar, excluir, adicionar, remover e mover.
        criadaEm: { type: string, format: date-time }
        atualizadaEm:
          type: string
          format: date-time
          description: Muda a cada edição, inclusão, remoção ou movimento de livro.
    CapaDaLista:
      type: object
      required: [livroId, tipo, titulo]
      properties:
        livroId: { type: string, format: uuid }
        tipo:
          type: string
          enum: [OFICIAL, PESSOAL]
        titulo:
          type: string
          description: Usado pelo placeholder quando não há capa.
        capaUrl:
          type: string
          format: uri
          nullable: true
    ListaResumo:
      type: object
      required: [id, titulo, quantidadeLivros, capas, atualizadaEm]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        descricao:
          type: string
          nullable: true
        quantidadeLivros: { type: integer, minimum: 0 }
        capas:
          type: array
          maxItems: 3
          description: Os três primeiros livros ativos pela ordem do dono.
          items: { $ref: '#/components/schemas/CapaDaLista' }
        atualizadaEm: { type: string, format: date-time }
        contemLivro:
          type: boolean
          description: Presente somente em listarMinhasListas com livroId.
    PaginaListas:
      type: object
      required: [itens, pagina, tamanho, totalItens, totalPaginas, ultima]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/ListaResumo' }
        pagina: { type: integer, minimum: 0 }
        tamanho: { type: integer, minimum: 1, maximum: 50 }
        totalItens: { type: integer, format: int64, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
        ultima: { type: boolean }
    LivroDaLista:
      type: object
      description: >-
        Dados atuais do livro, lidos de v_livro_referencia_v1 na consulta; não
        é snapshot.
      required: [id, tipo, titulo, link]
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [OFICIAL, PESSOAL]
        titulo: { type: string }
        autor:
          type: string
          nullable: true
          description: Nulo em livro sem autor; o cliente esconde a linha.
        capaUrl:
          type: string
          format: uri
          nullable: true
        link:
          allOf:
            - $ref: '#/components/schemas/LinkLivro'
          description: >-
            catalogo em livro oficial. Em livro pessoal, via=lista e
            referenciaId igual à lista; o acervo dispensa a via quando quem
            abre é o dono do livro.
    ItemDeLista:
      type: object
      required: [id, listaId, livro, posicao, adicionadoEm]
      properties:
        id: { type: string, format: uuid }
        listaId: { type: string, format: uuid }
        livro: { $ref: '#/components/schemas/LivroDaLista' }
        posicao:
          type: integer
          minimum: 1
          description: Posição contínua, sem buracos, a partir de 1.
        adicionadoEm: { type: string, format: date-time }
    ListaItens:
      type: object
      required: [itens, temMais]
      properties:
        itens:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ItemDeLista' }
        proximoCursor:
          type: string
          nullable: true
          description: Cursor opaco; ausente quando temMais é falso.
        temMais: { type: boolean }
    CriarDenuncia:
      type: object
      required: [alvoTipo, alvoId, motivo]
      properties:
        alvoTipo:
          type: string
          enum: [resenha, comentario]
        alvoId: { type: string, format: uuid }
        motivo:
          type: string
          description: >-
            Texto livre obrigatório; espaços das pontas são removidos. Até 500
            caracteres em code points.
          example: Conta o final sem aviso de spoiler.
        via:
          type: string
          enum: [feed, lista]
          description: Só para resenha de livro pessoal (RN-15.4).
        referenciaId:
          type: string
          format: uuid
          description: Atividade (via feed) ou lista (via lista) pela qual o leitor chegou.
    Denuncia:
      type: object
      description: >-
        Denúncia registrada. Não devolve o motivo nem dados do alvo: a resposta
        fica no recibo de idempotência.
      required: [id, estado, criadoEm]
      properties:
        id: { type: string, format: uuid }
        estado:
          type: string
          enum: [pendente, removida, arquivada]
        criadoEm: { type: string, format: date-time }
    PessoaDaModeracao:
      type: object
      nullable: true
      required: [id, username, nomeExibicao]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        nomeExibicao: { type: string }
        avatarUrl: { type: string, nullable: true }
    DenunciaPendente:
      type: object
      required: [id, tipo, criadoEm, motivo, remocaoNaoConfirmada]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [resenha, comentario] }
        criadoEm: { type: string, format: date-time }
        motivo: { type: string }
        denunciante: { $ref: '#/components/schemas/PessoaDaModeracao' }
        autor: { $ref: '#/components/schemas/PessoaDaModeracao' }
        livro:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            titulo: { type: string }
            pessoal: { type: boolean }
        atividade:
          type: object
          nullable: true
          description: Só no comentário. visivelParaAdmin decide o link Ver no feed.
          properties:
            id: { type: string, format: uuid }
            tipo: { type: string }
            autorNome: { type: string }
            livroTitulo: { type: string }
            visivelParaAdmin: { type: boolean }
        conteudo:
          type: object
          nullable: true
          description: Nulo quando o autor já excluiu o conteúdo.
          properties:
            texto: { type: string, description: Resenha em Markdown cru (RN-13). }
            spoiler: { type: boolean }
            nota: { type: number, nullable: true }
            publicadoEm: { type: string, format: date-time }
            respostas: { type: integer }
        remocaoNaoConfirmada: { type: boolean }
    PaginaDenuncias:
      type: object
      required: [itens, temMais]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/DenunciaPendente' }
        proximoCursor: { type: string, nullable: true }
        temMais: { type: boolean }
    ResultadoModeracao:
      type: object
      required: [denunciasFechadas]
      properties:
        denunciasFechadas:
          type: array
          items: { type: string, format: uuid }
    RegistroDeModeracao:
      type: object
      required: [id, criadoEm, acao, alvoTipo, comDenuncia, anonimizado]
      properties:
        id: { type: string, format: uuid }
        criadoEm: { type: string, format: date-time }
        acao: { type: string, enum: [remover_conteudo, arquivar_denuncia] }
        alvoTipo: { type: string, enum: [resenha, comentario, frase] }
        comDenuncia: { type: boolean }
        alvoAutor: { type: string, nullable: true, description: Username de quem escreveu. }
        atividadeAutor: { type: string, nullable: true }
        livroTitulo: { type: string, nullable: true }
        anonimizado: { type: boolean }
    PaginaRegistrosDeModeracao:
      type: object
      required: [itens, temMais]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/RegistroDeModeracao' }
        proximoCursor: { type: string, nullable: true }
        temMais: { type: boolean }
    ViolacaoCampo:
      type: object
      required: [campo, mensagem]
      properties:
        campo: { type: string, example: size }
        mensagem: { type: string, example: deve ser menor ou igual a 50 }
    Erro:
      type: object
      description: Corpo de erro padronizado (RNF-ERR-01), em pt-BR e sem detalhe técnico.
      required: [codigo, mensagem, correlationId]
      properties:
        codigo:
          type: string
          example: RECURSO_NAO_ENCONTRADO
        mensagem:
          type: string
          example: Não encontramos o recurso solicitado ou você não pode acessá-lo.
        correlationId:
          type: string
          format: uuid
    ErroValidacao:
      allOf:
        - $ref: '#/components/schemas/Erro'
        - type: object
          properties:
            violacoes:
              type: array
              items: { $ref: '#/components/schemas/ViolacaoCampo' }
