openapi: 3.0.3
info:
  title: Lê Ai - social
  version: 0.1.0
  description: >-
    Contrato do serviço **social**. O serviço mantém a projeção do feed,
    interações em atividades e notificações in-app. As operações de F-FEED e
    F-NOT do Período 1 estão implementadas. A exclusão de comentário
    pertence a F-SOCIAL-2 (Período 2) e aparece apenas para tornar explícito o
    contrato futuro e sua regra de propriedade. As listas de livros pertencem a
    F-LST (Período 2); as rotas estão implementadas no social desde 05/10/2026,
    e a via lista na página de livro pessoal do acervo entra na etapa seguinte.

    Atividades e notificações são criadas exclusivamente por consumidores
    idempotentes de eventos do broker. Não há endpoint HTTP público de ingestão.
    Todas as rotas de domínio exigem JWT e validam autorização, visibilidade e
    propriedade no servidor; conhecer um UUID não concede acesso.
  x-implementation-status:
    implemented:
      - GET /health
      - GET /feed
      - GET /atividades/{atividadeId}
      - POST /atividades/{atividadeId}/curtir
      - DELETE /atividades/{atividadeId}/curtir
      - POST /atividades/{atividadeId}/comentarios
      - GET /atividades/{atividadeId}/comentarios
      - GET /comentarios/{comentarioRaizId}/respostas
      - PATCH /comentarios/{comentarioId}
      - DELETE /comentarios/{comentarioId}
      - GET /notificacoes
      - POST /notificacoes/marcar-lidas
      - GET /notificacoes/tempo-real
      - POST /recomendacoes
      - GET /recomendacoes/candidatos
      - GET /recomendacoes/recebidas
      - DELETE /recomendacoes/{recomendacaoId}
      - POST /listas
      - GET /listas/{listaId}
      - PATCH /listas/{listaId}
      - DELETE /listas/{listaId}
      - GET /listas/{listaId}/livros
      - POST /listas/{listaId}/livros
      - DELETE /listas/{listaId}/livros/{livroId}
      - PUT /listas/{listaId}/livros/{itemId}/posicao
      - GET /perfis/{usuarioId}/listas
      - GET /me/listas
      - POST /denuncias
      - GET /admin/denuncias
      - POST /admin/denuncias/{denunciaId}/arquivar
      - POST /admin/denuncias/{denunciaId}/remover
      - GET /admin/moderacao/logs
x-database-contracts:
  - name: v_atividade_livro_pessoal_v1
    x-implementation-status: implemented
    description: >-
      Comprova a via feed para livro pessoal. Expõe somente atividades ativas;
      o consumidor ainda precisa revalidar seguimento aceito, autoria e vínculo
      entre atividade e livro. Consumidores: acervo (página do livro pessoal)
      e leitura (reação à resenha do dono, F-AVA-2).
    columns: [atividade_id, dono_id, livro_id]
  - name: v_lista_livro_pessoal_v1
    x-implementation-status: implemented
    description: >-
      Comprova a via lista para livro pessoal (RN-15, segunda via). Expõe um
      par lista/livro por item de lista ativa; lista excluída sai da VIEW na
      mesma transação. A VIEW existe no banco desde a migration do modelo
      social e é alimentada pelas rotas de listas; o consumo em acervo entra
      com a etapa 3 de F-LST. O consumidor ainda precisa
      revalidar o vínculo lista, dono e livro e a privacidade do dono (RN-08):
      perfil público libera qualquer leitor autenticado; perfil privado exige
      seguimento aceito. Diferente da via feed, seguir não é exigido quando o
      perfil é público. Consumidores: acervo (página do livro pessoal) e
      leitura (reação à resenha do dono, F-AVA-2), com a mesma regra.
    columns: [lista_id, dono_id, livro_id]
x-event-consumers:
  description: >-
    Registros de atividade e notificação são projeções criadas por consumidores
    RabbitMQ. Todo payload é validado por schema versionado antes do
     processamento; a entrega é deduplicada pelo recibo de eventId e o efeito
     usa a unicidade semântica definida pela feature; falhas após as retentativas seguem para DLQ. Estes contratos não
    representam endpoints HTTP.
  atividades:
    x-implementation-status: implemented
    queue: leai.social.feed
    events:
      - leitura.iniciada
      - leitura.retomada
      - leitura.finalizada
      - leitura.abandonada
      - resenha.publicada
      - resenha.excluida
    effect: >-
      Os cinco eventos de publicação criam uma atividade com snapshot mínimo
      de usuário e livro. resenha.excluida remove fisicamente a atividade da
      resenha e, por cascade, suas curtidas e comentários.
    required-envelope-fields:
      [eventId, type, version, occurredAt, correlationId, businessKey, data]
  notificacoes:
    x-implementation-status: implemented
    queue: leai.social.notificacoes
    events:
      - seguidor.novo
      - solicitacao.criada
      - solicitacao.aceita
      - atividade.curtida
      - atividade.comentada
      - comentario.respondido
      - usuario.mencionado
      - leitura.em_risco
      - leitura.expirada
      - recomendacao.recebida
      - resenha.curtida
    effect: >-
      Cria uma notificação para destinatarioId. resenha.curtida (F-AVA-2) só
      chega na primeira curtida do par resenha e leitor, e a chave de negócio
      `resenha:<resenhaId>:curtida:<autorAcaoId>` impede a segunda. A deduplicação semântica usa
      destinatário, tipo e chave de negócio; para inatividade, inclui leitura,
      versão do ciclo e limiar de 20, 30 ou 40 dias. A notificação guarda um
      snapshot de quem agiu, do livro e da atividade alvo; a frase em pt-BR é
      montada na leitura. O mapa evento → notificação está em
      EventoDeNotificacao, no código do serviço.
    required-envelope-fields:
      [eventId, type, version, occurredAt, correlationId, businessKey, data]
    required-data-fields: [destinatarioId]
  recomendacoes:
    x-implementation-status: implemented
    queue: leai.social.recomendacoes
    events:
      - livro.adicionado_a_estante
    effect: >-
      Remove fisicamente todas as recomendações do livro recebidas pelo leitor
      que o adicionou à estante (RF-REC-16, RN-22.10), sem notificar o
      remetente. Reentrega não tem efeito adicional. Uma rotina diária do
      próprio serviço apaga as recomendações vencidas (RN-22.9) e reconcilia
      com leitura.v_estante_publica_v1 as que o consumidor não viu, o que cobre
      o backfill do intervalo antes de a fila existir.
    required-envelope-fields:
      [eventId, type, version, occurredAt, correlationId, businessKey, data]
  planned-future-events:
    x-implementation-status: planned-after-periodo-1
    events:
      - lembrete.sequencia
    description: >-
      Só entram no consumidor quando a feature produtora definir nome, schema,
      chave de negócio, retentativa, DLQ e testes. Não são gerados no Período 1.
x-external-actions:
  abandonar-leitura-em-risco:
    x-implementation-status: implemented
    service: leitura
    method: POST
    path: /leituras/{leituraId}/abandonar
    description: >-
      A notificação LEITURA_EM_RISCO fornece leituraId e esta ação. Após
      confirmação explícita no cliente, ele chama diretamente o serviço
      leitura com JWT e a mesma Idempotency-Key. O serviço leitura revalida
      propriedade e estado. O serviço social não altera nem lê tabelas de
      leitura e, portanto, não expõe uma rota de abandono.
servers:
  - url: http://localhost:8081
    description: local
tags:
  - name: feed
    description: Feed cronológico e detalhe de atividade
  - name: interacoes
    description: Curtidas, comentários e respostas
  - name: listas
    description: Listas de livros curadas pelo leitor (F-LST)
  - name: notificacoes
    description: Notificações in-app do leitor autenticado
  - name: recomendacoes
    description: Recomendação de livro entre leitores com seguimento mútuo (F-REC-P2P)
  - name: moderacao
    description: Denúncia de resenhas e comentários e moderação pelo administrador (F-MOD)
  - name: health
    description: Sondagem de disponibilidade
security:
  - bearerAuth: []
paths:
  /feed:
    get:
      tags: [feed]
      summary: Lista o feed cronológico do leitor (RF-SOC-09)
      operationId: listarFeed
      x-implementation-status: implemented
      description: >-
        Retorna atividades dos leitores que o solicitante segue, em ordem
        decrescente de criação. A autorização é revalidada a cada consulta:
        deixar de seguir remove as atividades do resultado; perfil suspenso,
        conteúdo privado sem seguimento aceito e atividade cujo livro esteja
        ausente ou inativo não são exibidos. Para livro pessoal, a atividade
        retornada é a referência que habilita a via feed de RN-15.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página do feed em ordem cronológica decrescente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAtividades' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /atividades/{atividadeId}:
    parameters:
      - $ref: '#/components/parameters/AtividadeId'
    get:
      tags: [feed]
      summary: Obtém o detalhe de uma atividade visível
      operationId: obterAtividade
      x-implementation-status: implemented
      description: >-
        Revalida se a atividade ainda integra o feed do solicitante sob RN-08
        e RN-09. Para evitar enumeração, uma atividade existente mas não
        visível responde como não encontrada.
      responses:
        '200':
          description: Atividade visível com snapshot e contadores atuais.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atividade' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /atividades/{atividadeId}/curtir:
    parameters:
      - $ref: '#/components/parameters/AtividadeId'
    post:
      tags: [interacoes]
      summary: Curte uma atividade visível (RF-SOC-11)
      operationId: curtirAtividade
      x-implementation-status: implemented
      description: >-
        Cria no máximo uma curtida por leitor e atividade. Revalida que a
        atividade ainda integra o feed do solicitante e está sujeita a rate
        limiting. Repetir a mesma chave com o mesmo payload devolve o mesmo
        efeito; reutilizá-la em outra operação ou payload responde 409. Após a
        escrita, atividade.curtida é gravado na outbox na mesma transação.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Curtida criada, ou resposta reproduzida pela mesma chave.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoCurtida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
    delete:
      tags: [interacoes]
      summary: Remove a própria curtida de uma atividade (RF-SOC-11)
      operationId: descurtirAtividade
      x-implementation-status: implemented
      description: >-
        Remove somente a curtida pertencente ao leitor autenticado e revalida
        a visibilidade da atividade. Ausência da própria curtida mantém o
        resultado idempotente. Não remove curtida de outro leitor.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Curtida própria ausente após a operação.
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /atividades/{atividadeId}/comentarios:
    parameters:
      - $ref: '#/components/parameters/AtividadeId'
    get:
      tags: [interacoes]
      summary: Lista comentários-raiz de uma atividade
      operationId: listarComentariosRaiz
      x-implementation-status: implemented
      description: >-
        Lista somente comentários-raiz, paginados e ordenados do mais antigo
        para o mais recente. As respostas são consultadas pela rota própria. A
        atividade precisa continuar visível ao solicitante.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de comentários-raiz.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaComentarios' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
    post:
      tags: [interacoes]
      summary: Comenta uma atividade ou responde a um comentário (RF-SOC-12)
      operationId: criarComentario
      x-implementation-status: implemented
      description: >-
        Sem comentarioRespondidoId cria comentário-raiz. Com o campo, cria uma
        resposta. Se o alvo já for resposta, o novo registro fica como irmão
        sob a mesma raiz; o servidor deriva a raiz e usuarioRespondido do alvo,
        sem confiar no texto. No Período 1 o cliente pré-preenche @username,
        mas menção arbitrária ainda não é resolvida. Revalida visibilidade,
        trata o conteúdo como texto e aplica rate limiting. Publica pela outbox
        atividade.comentada ou comentario.respondido, nunca os dois para uma
        resposta ao mesmo destinatário.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CriarComentario' }
      responses:
        '201':
          description: Comentário ou resposta criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comentario' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '422': { $ref: '#/components/responses/RegraNegocioInvalida' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /comentarios/{comentarioRaizId}/respostas:
    parameters:
      - $ref: '#/components/parameters/ComentarioRaizId'
    get:
      tags: [interacoes]
      summary: Lista respostas diretas de um comentário-raiz
      operationId: listarRespostas
      x-implementation-status: implemented
      description: >-
        Paginação por cursor estável. Retorna apenas respostas irmãs sob a raiz,
        inclusive quando foram criadas em resposta a outra resposta. Revalida a
        visibilidade da atividade antes de retornar qualquer comentário.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
      responses:
        '200':
          description: Segmento de respostas e cursor para o próximo segmento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaRespostas' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /comentarios/{comentarioId}:
    parameters:
      - $ref: '#/components/parameters/ComentarioId'
    patch:
      tags: [interacoes]
      summary: Edita um comentário pertencente ao leitor (RF-SOC-13)
      operationId: editarComentario
      x-implementation-status: implemented
      description: >-
        Somente o autor pode editar. Raiz, alvo e nível não mudam (RN-10). As
        menções do texto são reprocessadas: username existente vira menção,
        inexistente continua texto (RN-10.1). usuario.mencionado só sai para
        destinatário que este comentário ainda não notificou, nunca para o
        autor nem para o alvo de comentario.respondido. Menções que notificam
        têm rate limiting próprio (RN-10.3); estourar recusa a edição com 429.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditarComentario' }
      responses:
        '200':
          description: Comentário com o texto novo e as menções resolvidas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comentario' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
    delete:
      tags: [interacoes]
      summary: Exclui um comentário pertencente ao leitor (RF-SOC-13)
      operationId: excluirComentario
      x-implementation-status: implemented
      description: >-
        Somente o autor pode excluir. Exclusão física: excluir comentário-raiz
        remove suas respostas e menções por cascade (RN-10.5); excluir resposta
        remove somente ela. O cliente exige confirmação explícita e o servidor
        não aceita autoria informada pelo cliente.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Comentário próprio excluído.
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /listas:
    post:
      tags: [listas]
      summary: Cria uma lista do leitor (RF-LST-01)
      operationId: criarLista
      x-implementation-status: implemented
      description: >-
        Cria uma lista cujo dono é sempre o leitor autenticado; o servidor não
        aceita dono informado pelo cliente. Com livroId, a lista nasce com esse
        livro na posição 1, na mesma transação, para que criar a partir da
        página do livro nunca deixe uma lista sem o livro. O livro precisa
        estar ativo e ser oficial ou livro pessoal do próprio leitor (RN-15.1).
        Título e descrição são texto puro. Sujeito a rate limiting.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CriarLista' }
      responses:
        '201':
          description: Lista criada, ou resposta reproduzida pela mesma chave.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lista' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '422': { $ref: '#/components/responses/RegraNegocioInvalida' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
  /listas/{listaId}:
    parameters:
      - $ref: '#/components/parameters/ListaId'
    get:
      tags: [listas]
      summary: Obtém os metadados de uma lista visível (RF-LST-04)
      operationId: obterLista
      x-implementation-status: implemented
      description: >-
        O dono sempre vê a própria lista. Terceiros veem se o perfil do dono
        é público ou se seguem o dono com solicitação aceita (RN-08). Perfil
        privado sem seguimento responde 403 com mensagem de perfil privado, e
        o cliente mostra o bloco de restrição. Lista inexistente, excluída ou
        de conta suspensa ou em exclusão responde 404. Os itens são
        consultados pela rota própria, paginada.
      responses:
        '200':
          description: Metadados da lista.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lista' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/PerfilPrivado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '503': { $ref: '#/components/responses/Indisponivel' }
    patch:
      tags: [listas]
      summary: Edita título e descrição da própria lista (RF-LST-03)
      operationId: editarLista
      x-implementation-status: implemented
      description: >-
        Owner-only. Campo omitido permanece; descricao nula apaga a descrição.
        Lista alheia responde 404, sem confirmar sua existência.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditarLista' }
      responses:
        '200':
          description: Lista atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lista' }
        '400': { $ref: '#/components/responses/RequisicaoInvalida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
    delete:
      tags: [listas]
      summary: Exclui a própria lista (RF-LST-03)
      operationId: excluirLista
      x-implementation-status: implemented
      description: >-
        Owner-only. O cliente exige confirmação explícita (RNF-USA-04). A
        exclusão é lógica: a lista deixa de aparecer em todas as rotas e em
        v_lista_livro_pessoal_v1 na mesma transação, o que encerra na hora a
        via lista para os livros pessoais que ela continha. Lista já excluída
        mantém o resultado idempotente.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Lista própria ausente após a operação.
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/ConflitoIdempotencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
