# ==========================================================================
# render.yaml — Blueprint do ambiente DES/HML do Lê Ai (P0-DEPLOY)
#
# Infraestrutura como código: o Render cria/atualiza estes serviços a partir
# deste arquivo. Deploy só de código versionado, a cada push na `main`
# (RNF-SEC-34). SEGREDOS NÃO FICAM AQUI: use `sync: false` e preencha o valor
# no painel do Render (RNF-SEC-11). HTTPS é terminado pelo Render (RNF-SEC-08).
#
# Banco: o projeto Neon do DES (`le-ai-oregon`, separado do de dev desde
# 25/09), um schema por serviço (arquitetura §4.1).
# O Drizzle qualifica tabelas pelo pgSchema e o Spring fixa DB_SCHEMA. A URL
# do Neon nao precisa carregar `options=-csearch_path`, rejeitado pelo pooler.
#
# NOTAS IMPORTANTES:
#  - `identidade` e `social` (Spring/Java) usam runtime `docker` — o Render NÃO
#    tem runtime Java nativo. Cada um precisa de um `Dockerfile` (ver rootDir).
#  - `acervo` e `leitura` (NestJS) usam runtime `node` nativo.
#  - Migrations Nest rodam antes da API em `npm run start:prod`; Spring roda
#    Flyway no boot. Todo SQL continua sujeito a revisao humana antes do merge.
#  - Free tier hiberna após ~15 min; a 1ª chamada leva 30-60 s (tratado nos
#    clientes como carregamento, RNF-ERR-09).
# ==========================================================================

services:
  # ---------------------------------------------------------------- acervo
  - type: web
    name: leai-acervo
    runtime: node
    plan: free
    branch: main
    rootDir: code/back/acervo
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: acervo
      - key: DB_SCHEMA
        value: acervo
      - key: DATABASE_URL # Neon com ?sslmode=require
        sync: false
      - key: CORS_ALLOWED_ORIGINS # origem do site em DES (sem curinga, RNF-SEC-21)
        value: https://leai-web.onrender.com
      - key: AMQP_ENABLED
        value: "true"
      - key: AMQP_URL # preencher no painel antes do deploy da main
        sync: false
      - key: JWT_SECRET # MESMO valor do leai-identidade; sem ele toda rota autenticada dá 401
        sync: false
      - key: CLOUDINARY_CLOUD_NAME # valida a URL de capa de livro pessoal (RNF-SEC-20)
        sync: false
      # F-CONTA-2: credencial da Upload API, para apagar as capas de livro pessoal
      # na exclusão definitiva de conta (RN-23.7). Sem ela a capa fica no Cloudinary.
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_BOOKS_API_KEY # fonte secundária do cadastro por ISBN; sem ela o Google responde 429 por cota (P-14)
        sync: false

  # --------------------------------------------------------------- leitura
  - type: web
    name: leai-leitura
    runtime: node
    plan: free
    branch: main
    rootDir: code/back/leitura
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: leitura
      - key: DB_SCHEMA
        value: leitura
      - key: DATABASE_URL # Neon com ?sslmode=require
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://leai-web.onrender.com
      - key: AMQP_ENABLED
        value: "true"
      - key: AMQP_URL
        sync: false
      # F-AVA (fatia 0): obrigatório em produção; sem ele o serviço não sobe.
      # Preencher no painel ANTES do merge na main, com o MESMO valor do
      # leai-identidade.
      - key: JWT_SECRET
        sync: false
      # F-EST: token do POST /internal/jobs/inatividade (RN-05), chamado pelo
      # workflow job-inatividade. Mínimo de 32 caracteres; o MESMO valor vai no
      # secret LEITURA_SCHEDULER_TOKEN do GitHub. Sem ele o job responde 401.
      - key: SCHEDULER_TOKEN
        sync: false

  # ------------------------------------------------------------ identidade
  # Spring Boot (Java) — requer Dockerfile em code/back/identidade/Dockerfile.
  - type: web
    name: leai-identidade
    runtime: docker
    plan: free
    branch: main
    rootDir: code/back/identidade
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVICE_NAME
        value: identidade
      - key: DB_SCHEMA
        value: identidade
      - key: DATABASE_URL # URL JDBC (jdbc:postgresql://host/db?sslmode=require)
        sync: false
      - key: DATABASE_USERNAME # driver Java não aceita user na URL — vem separado
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://leai-web.onrender.com
      - key: AMQP_ENABLED
        value: "true"
      - key: AMQP_URL
        sync: false
      # Dispara o ping de prova `identidade` -> `acervo` do DoD de P0-MSG.
      # Gateado por @ConditionalOnProperty; só vale com AMQP_ENABLED=true.
      # Desligar de volta depois de registrar a evidência.
      - key: P0_PING_ENABLED
        sync: false
      - key: BREVO_API_KEY # segredo da API do Brevo; preencher no painel
        sync: false
      - key: BREVO_SMTP_KEY # segredo SMTP do Brevo; preencher no painel
        sync: false
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SENDER_EMAIL # remetente verificado no Brevo
        sync: false
      - key: BREVO_SENDER_NAME
        value: Lê Ai
      - key: WEB_BASE_URL # base do link de recuperação de senha enviado por e-mail
        value: https://leai-web.onrender.com
      - key: CLOUDINARY_CLOUD_NAME # valida a URL do avatar (RNF-SEC-20); nome público do cloud
        value: leai
      - key: JWT_SECRET # segredo forte, aleatório
        sync: false
      - key: ADMIN_EMAIL # admin fixo provisionado por ambiente (RF-AUT-08)
        sync: false
      - key: ADMIN_PASSWORD # senha forte, distinta de qualquer default (RNF-SEC-31)
        sync: false
      # F-CONTA-2: token do job diário de exclusão de conta, chamado pelo workflow
      # job-exclusao-conta. Mínimo de 32 caracteres; o MESMO valor vai no secret
      # IDENTIDADE_SCHEDULER_TOKEN do GitHub. Sem ele o job responde 401.
      - key: SCHEDULER_TOKEN
        sync: false
      # F-CONTA-2: credencial da Upload API, para apagar o avatar na exclusão
      # definitiva (RN-23.7). Sem ela o asset fica e o publicId vai para o log.
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ---------------------------------------------------------------- social
  # Spring Boot (Java) — requer Dockerfile em code/back/social/Dockerfile.
  - type: web
    name: leai-social
    runtime: docker
    plan: free
    branch: main
    rootDir: code/back/social
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVICE_NAME
        value: social
      - key: DB_SCHEMA
        value: social
      - key: DATABASE_URL # URL JDBC (jdbc:postgresql://host/db?sslmode=require)
        sync: false
      - key: DATABASE_USERNAME # driver Java não aceita user na URL — vem separado
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://leai-web.onrender.com
      - key: AMQP_ENABLED
        value: "true"
      - key: AMQP_URL
        sync: false
      # F-FEED/F-NOT: obrigatório (AppProperties exige @NotBlank, 32+ caracteres);
      # sem ele o serviço não sobe. MESMO valor do leai-identidade.
      - key: JWT_SECRET
        sync: false

  # ------------------------------------------------------- site estático web
  - type: web
    name: leai-web
    runtime: static
    branch: main
    rootDir: code/front
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # Build-time (embutida no bundle). Decidir gateway único vs URL por
      # serviço; por ora aponte para o backend de DES desejado.
      - key: VITE_API_BASE_URL
        sync: false
      # URL por serviço (decisão de 12/09, P0-NAV) — cadastro, login e /me.
      # Não é segredo: é a URL pública do serviço em DES, mesmo padrão do
      # CORS_ALLOWED_ORIGINS acima.
      - key: VITE_IDENTIDADE_BASE_URL
        value: https://leai-identidade.onrender.com
      # F-ACV-CADASTRO: cadastro por ISBN e livro pessoal.
      - key: VITE_ACERVO_BASE_URL
        value: https://leai-acervo.onrender.com
      # F-AVA, F-EST e F-PRG: nota, resenha, estante e progresso. Sem ela a
      # web do DES chamaria `undefined/...`.
      - key: VITE_LEITURA_BASE_URL
        value: https://leai-leitura.onrender.com
      # F-FEED e F-NOT: feed, curtidas, comentários e notificações. Sem ela a
      # web do DES chamaria `undefined/...`.
      - key: VITE_SOCIAL_BASE_URL
        value: https://leai-social.onrender.com
      # Capa de livro pessoal direto ao Cloudinary. Não é segredo: o preset é
      # UNSIGNED e público por natureza (P-09); o cloud é o mesmo do acervo.
      - key: VITE_CLOUDINARY_CLOUD_NAME
        value: leai
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        value: leai_capas
      # F-PERFIL: avatar direto ao Cloudinary, preset unsigned da pasta avatares.
      - key: VITE_CLOUDINARY_AVATAR_PRESET
        value: leai_avatares
    routes:
      # SPA: toda rota cai no index.html (Vue Router em history mode).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
